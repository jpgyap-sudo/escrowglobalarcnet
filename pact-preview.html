        recoveryRaw=rawNew;recoveryKey=STORAGE;recoveryError=err;
        throw new Error('Saved sandbox data failed validation.');
      }
      state=migrated;
      storageSnapshot=rawNew;
      try{actorId=localStorage.getItem(STORAGE+'-actor')||localStorage.getItem(LEGACY_STORAGE+'-actor')||'buyer';}catch{}
      if(!user(actorId))actorId='buyer';
      return;
    }
    // new absent, try legacy
    let rawOld;
    try{rawOld=localStorage.getItem(LEGACY_STORAGE);}catch{rawOld=undefined;}
    if(rawOld===undefined){
      memoryOnly=true;
      const seed=createSeedState();
      validateState(seed);
      state=seed;
      storageSnapshot=null;
      try{actorId=localStorage.getItem(STORAGE+'-actor')||localStorage.getItem(LEGACY_STORAGE+'-actor')||'buyer';}catch{}
      if(!user(actorId))actorId='buyer';
      setTimeout(()=>toast('Storage is unavailable. This session remains in memory only.',true),0);
      return;
    }
    if(rawOld!==null){
      let parsedOld;

      catch(err){
        recoveryRaw=rawOld;recoveryKey=LEGACY_STORAGE;recoveryError=err;

        throw new Error('Legacy sandbox data failed validation.');

          state=remigrated;storageSnapshot=recheck;

          if(!user(actorId))actorId='buyer';

        }
        throw new Error('Another tab changed storage. Refresh before retrying.');
      }
      const serialized=JSON.stringify(migrated);
      if(!writeRaw(STORAGE,serialized)){
        // quota failure: keep in memory
        memoryOnly=true;
        state=migrated;
        storageSnapshot=null;
        try{actorId=localStorage.getItem(STORAGE+'-actor')||localStorage.getItem(LEGACY_STORAGE+'-actor')||'buyer';}catch{}

async function command(type,payload,idempotencyKey=newOperationId()){
  if(EMBEDDED){
    if(!memoryOnly){
      let current;
      try{current=localStorage.getItem(STORAGE);}catch{current=undefined;}
      if(current===undefined){
        memoryOnly=true;
      }else if(current!==storageSnapshot){
        throw new Error('Another tab changed the saved sandbox. Refresh before retrying.');
      }
    }
    const out=applyCommand(state,actorId,type,payload);
    validateState(out.state);
    if(!memoryOnly){
      const serialized=JSON.stringify(out.state);
      let ok=false;
      try{localStorage.setItem(STORAGE,serialized);ok=true;}catch{ok=false;}
      if(!ok){
        memoryOnly=true;
        state=out.state;
        storageSnapshot=null;
        toast('Storage write failed. This session remains in memory only.',true);
        return out.result;
      }
      storageSnapshot=serialized;
    }
    state=out.state;
    return out.result;
  }
  const response=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actorId,command:type,payload,idempotencyKey})});
  const out=await response.json();
  if(!response.ok)throw new Error(out.error||'Command failed.');
  state=migrateState(out.state);
  validateState(state);
  return out.result;
}

est a custom deal','custom-seller',`data-seller="${e(seller.id)}"`,'btn-small mt12')}</div></aside></div></main>`;

function actionCenterPanel(orders,a){const actions=deriveActionCenter(orders,a,Date.now()),shown=actions.slice(0,6);if(!shown.length)return `<section class="action-center panel soft mb20" data-action-center><div class="row between"><div><div class="eyebrow">ACTION CENTER · SIMULATION</div><h3>You’re all caught up.</h3></div><span class="pill green">No urgent actions</span></div><p class="small mt12">New acceptance, delivery, review and resolution decisions will appear here. This panel only explains the next step; it never moves funds.</p></section>`;const card=x=>`<article class="action-card ${e(x.severity)}"><div class="action-card-mark">${x.severity==='urgent'?'!':x.severity==='attention'?'•':'i'}</div><div class="action-card-copy"><div class="row between gap12"><strong>${e(x.title)}</strong><span class="pill ${x.severity==='urgent'?'red':x.severity==='attention'?'warn':'green'}">${e(x.severity)}</span></div><p>${e(x.body)}</p><div class="row wrap mt12"><a class="btn btn-small ${x.severity==='urgent'?'btn-danger':'btn-primary'}" href="${e(x.cta.route)}">${e(x.cta.label)} ${icon('arrow')}</a>${x.deadlineAt?`<span class="tiny muted">Deadline ${e(timestamp(x.deadlineAt))}</span>`:''}</div></div></article>`;return `<section class="action-center panel soft mb20" data-action-center aria-labelledby="action-center-title"><div class="row between"><div><div class="eyebrow">ACTION CENTER · SIMULATION</div><h3 id="action-center-title">The next decision is clear.</h3></div><span class="pill">${actions.length} item${actions.length===1?'':'s'}</span></div><p class="small mt12">Priority prompts for ${e(a.role==='admin'?'the review team':a.name)}. Open a deal to act through its existing, role-limited workflow.</p><div class="action-center-list">${shown.map(card).join('')}</div>${actions.length>shown.length?`<p class="tiny muted mt12">Showing the six highest-priority items. Open My deals for the full list.</p>`:''}<p class="tiny muted mt12">Sandbox reminder: notifications are derived from local state and deadlines; they are not chain confirmations or legal notices.</p></section>`;}
function dashboard(){const a=actor(),orders=state.orders.filter(o=>a.role==='admin'||[o.buyerId,o.sellerId].includes(a.id)),filtered=orders.filter(o=>orderFilter==='all'||(orderFilter==='active'?['in progress','in review','awaiting acceptance','awaiting funding'].includes(orderStatus(o)):orderStatus(o)===orderFilter));
 const disputes=orders.flatMap(o=>o.milestones).filter(m=>m.status==='disputed').length;
 const lockedTotals=assetTotals(orders,o=>o.asset,o=>principalHeld(o));

const stat=(label,value,unit,foot,ico)=>`<div class="stat-card"><div class="label">${icon(ico)}${label}</div><div class="value">${value}<span class="unit">${unit}</span></div><div class="foot">${foot}</div></div>`;
function dealRow(o){return `<a class="deal-row" href="#/deal/${e(o.id)}"><div><div class="deal-title">${e(o.title)}</div><div class="meta">${e(user(o.sellerId).name)} · ${e(o.snapshot.package)} · ${o.milestones.length} milestone${o.milestones.length>1?'s':''}</div></div><div>${pill(orderStatus(o))}</div><div class="amount-col"><div class="row-label">Principal held</div><div class="row-number">${fmt(principalHeld(o))} <span class="tiny muted">${e(o.asset)}</span></div></div><div class="optional-col"><div class="row-label">Created</div><div class="small mt12">${date(o.createdAt)}</div></div><span class="optional-col">${icon('chevron')}</span></a>`;}
function realEstatePanel(o){const r=o.realEstate;if(!r)return '';const kinds={residential_purchase:'Residential purchase',commercial_purchase:'Commercial purchase',land_purchase:'Land purchase'};const cashClose=BigInt(r.purchasePrice)-BigInt(r.earnestDeposit);return `<section class="panel u-real-estate-panel mb20"><div class="row between"><div><div class="eyebrow">REAL ESTATE ESCROW · EARNEST-ONLY DEMO</div><h3>${e(kinds[r.transactionType]||r.transactionType)}</h3></div><span class="pill warn">Closing checklist</span></div><div class="u-real-estate-summary"><div><span class="row-label">Property reference</span><strong>${e(r.propertyReference)}</strong></div><div><span class="row-label">Purchase price</span><strong>${fmt(r.purchasePrice)} ${e(o.asset)}</strong></div><div><span class="row-label">Earnest deposit</span><strong>${fmt(r.earnestDeposit)} ${e(o.asset)}</strong></div><div><span class="row-label">Cash to close after earnest</span><strong>${fmt(cashClose.toString())} ${e(o.asset)}</strong></div><div><span class="row-label">Target closing</span><strong>${e(new Date(r.targetClosingDate+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}))}</strong></div><div><span class="row-label">Settlement contact</span><strong>${e(r.settlementContact)}</strong></div></div><div class="u-contingency-grid mt20"><span class="pill ${r.financingContingency?'green':''}">${r.financingContingency?'✓':'—'} Financing contingency</span><span class="pill ${r.appraisalContingency?'green':''}">${r.appraisalContingency?'✓':'—'} Appraisal contingency</span><span class="pill warn">${r.inspectionDays}-day due diligence</span></div><div class="u-closing-checklist mt20"><h4>Closing conditions</h4>${r.closingConditions.map(x=>`<div><span class="u-checkmark">○</span><span>${e(x)}</span></div>`).join('')}</div><div class="u-note warning mt20"><strong>Wire-safety reminder</strong><p>Never trust a last-minute change to payment instructions. Verify the settlement contact using a known phone number or trusted source before any transfer. This sandbox does not verify title, parties, wiring details, or closing readiness.</p></div></section>`;}
function domainTransferPanel(o){const d=o.domainSale,m=o.milestones[0],a=actor(),buyer=a.id===o.buyerId,seller=a.id===o.sellerId;if(!d)return '';const attrs=`data-order="${e(o.id)}" data-milestone="${e(m.id)}"`;let actions='';if(seller&&o.fundedAt&&m.status==='funded')actions=button('Initiate domain transfer','domain-transfer-initiate',attrs,'btn-primary');if(buyer&&m.status==='submitted')actions=button('Verify DNS control & release','domain-transfer-verify',attrs,'btn-primary')+button('Report transfer problem','domain-transfer-reject',attrs,'btn-danger btn-small');return `<section class="panel u-domain-transfer mb20"><div class="row between"><div><div class="eyebrow">DOMAIN TRANSFER CHECKLIST</div><h3>${e(d.domainName)}</h3></div>${pill(d.status.replaceAll('_',' '))}</div><div class="u-domain-transfer-grid"><div><span class="row-label">Registrar</span><strong>${e(d.registrar)}</strong></div><div><span class="row-label">Transfer method</span><strong>${e(d.transferMethod==='registrar_push'?'Registrar push':'Authorization code')}</strong></div><div><span class="row-label">Expiry</span><strong>${e(d.expiryDate)}</strong></div><div><span class="row-label">Renewal</span><strong>${e(d.renewalResponsibility)}</strong></div></div>${m.status==='submitted'&&buyer?`<div class="readonly-note mt20">Buyer DNS challenge: <code>${e(d.buyerDnsChallenge)}</code><br>Enter it only after you confirm control in the transferred registrar/DNS account.</div>`:''}<p class="tiny muted mt20">This is a sandbox checklist. No registrar API, RDAP lookup, DNS query, or auth-code storage is active.</p>${actions?`<div class="row wrap mt20">${actions}</div>`:''}</section>`;}
function dealReadiness(o,actorId){const milestones=Array.isArray(o.milestones)?o.milestones:[],total=milestones.length||1,submitted=milestones.filter(m=>m.status==='submitted').length,delivered=milestones.filter(m=>Array.isArray(m.deliveries)&&m.deliveries.length>0).length,settled=milestones.filter(m=>['released','refunded','settled'].includes(m.status)).length,disputed=milestones.filter(m=>m.status==='disputed').length;const item=(name,value,detail,done)=>`<div class="deal-readiness-item ${done?'is-done':'is-pending'}"><span class="deal-readiness-mark" aria-hidden="true">${done?'✓':'○'}</span><div><strong>${e(name)}</strong><span>${e(value)}</span><small>${e(detail)}</small></div></div>`;let next='';if(o.cancelled)next='This agreement is closed. Create a new deal to restart.';else if(disputed)next=actorId==='reviewer'?'Review the disputed milestone and choose the restricted outcome.':'Review the claim or send a bilateral proposal; the disputed milestone is frozen.';else if(!o.acceptedAt)next=actorId===o.sellerId?'Review and accept the exact agreement terms.':'Waiting for the seller to accept the exact agreement terms.';else if(!o.fundedAt)next=actorId===o.buyerId?'Review the total and fund the agreed milestones.':'Agreement accepted; waiting for the buyer to fund it.';else if(submitted)next=actorId===o.buyerId?'Review the submitted work against its checklist.':'A milestone is under buyer review.';else if(delivered<total)next=actorId===o.sellerId?'Submit the next delivery with its evidence reference.':'Work is in progress; watch the next delivery milestone.';else if(settled<total)next='Complete the next acceptance or resolution step.';else next='All milestones are settled. Close the loop with a review.';return `<section class="deal-readiness panel soft mb20" aria-labelledby="deal-readiness-title"><div class="deal-readiness-head"><div><div class="eyebrow">DEAL PATH · SIMULATION</div><h3 id="deal-readiness-title">Your next step is clear.</h3></div><span class="pill">No real tokens</span></div><div class="deal-readiness-grid">${item('Terms',o.cancelled?'Closed':o.acceptedAt?'Both parties accepted':'Seller acceptance pending',o.acceptedAt?'Version '+String(o.version||1)+' is ready for the next stage.':'The buyer cannot fund until the seller accepts.',Boolean(o.acceptedAt))}${item('Funding',o.fundedAt?'Funded':'Not funded',o.fundedAt?'All milestones are held in the simulation.':'Funding debits simulated credits only.',Boolean(o.fundedAt))}${item('Delivery',submitted?`${submitted}/${total} under review`:delivered?`${delivered}/${total} delivered`:'Waiting for delivery',submitted?'Buyer review is required before release.':'Evidence and acceptance remain part of the agreement.',delivered===total||settled===total)}${item('Settlement',`${settled}/${total} settled`,disputed?`${disputed} milestone${disputed>1?'s are':' is'} frozen.`:'Released and refunded amounts remain recorded.',settled===total)}</div><p class="deal-readiness-next"><strong>Next:</strong> ${e(next)}</p></section>`;}
function fundingReviewSummary(o,principal,reserve,total){return `<section class="funding-review-summary panel soft mt20" aria-label="Funding review summary"><div class="eyebrow">FUNDING REVIEW · SIMULATION</div><h3>Check the exact agreement before continuing.</h3><div class="funding-review-grid">${keyValue('Agreement',e(o.id))}${keyValue('Terms version',e(o.termsVersion||o.version||'1'))}${keyValue('Milestones',String(o.milestones.length))}${keyValue('Asset',e(o.asset))}</div><div class="readonly-note mt12"><strong>Fixed destinations</strong><br>Buyer refund: <code>${e(o.buyerWallet)}</code><br>Seller payout: <code>${e(o.sellerWallet)}</code><br>Fee recipient: <code>${e(o.feeWallet)}</code></div><p class="tiny muted mt12">Terms commitment: <code>${e(o.currentTermsHash||o.termsHash||'Legacy sandbox agreement')}</code></p><p class="tiny muted mt12">This screen previews what a future wallet review would need to confirm. It is not a signature request and does not connect to Solana.</p></section>`;}
function rightsDashboard(o,actorId){
 const milestones=Array.isArray(o.milestones)?o.milestones:[],disputed=milestones.find(m=>m.status==='disputed'),active=milestones.find(m=>!['released','refunded','settled'].includes(m.status));
 let owner='No action pending',action='Agreement is closed or fully settled.',deadline='No active deadline';
 if(disputed){owner='Review team + both original parties';action=actorId==='reviewer'?'Review the frozen claim against the agreement.':'Keep evidence in the deal room and use the permitted resolution path.';deadline='Frozen until release, refund, or bilateral proposal';}
 else if(!o.acceptedAt){owner=o.sellerId===actorId?'You · seller':'Seller';action='Review and accept the exact agreement terms.';deadline='Funding is not available yet';}
 else if(!o.fundedAt){owner=o.buyerId===actorId?'You · buyer':'Buyer';action='Review the total and fund the agreed milestones.';deadline='Funding deadline is not active in this sandbox';}
 else if(active){
   if(active.status==='submitted'){owner=o.buyerId===actorId?'You · buyer':'Buyer';action='Compare the delivery with every acceptance criterion.';deadline=o.snapshot.acceptance==='timed'&&active.reviewEndsAt?`Review window ends ${timestamp(active.reviewEndsAt)}`:`Manual approval required · delivery due ${timestamp(active.dueAt)}`;}
   else if(active.status==='funded'){owner=o.sellerId===actorId?'You · seller':'Seller';action='Submit the next delivery with an evidence reference.';deadline=active.dueAt?`Delivery due ${timestamp(active.dueAt)}`:'Delivery deadline not recorded';}
   else {owner='Both original parties';action='Complete the next permitted milestone action.';deadline=active.dueAt?`Current milestone date ${timestamp(active.dueAt)}`:'No current deadline';}
 }
 const fallback=disputed?'A dispute freezes only this milestone. A production case owner, response SLA, appeal path, and fee sponsorship are not provided here.':o.fundedAt?'Missed deadlines do not run by browser timer; a future chain-authoritative transaction and reconciler must verify eligibility.':'No money moves before both-party acceptance and an explicit funding action.';
 return `<section class="rights-dashboard panel soft mb20" data-rights-dashboard aria-labelledby="rights-dashboard-title"><div class="rights-head"><div><div class="eyebrow">RIGHTS & DEADLINES · SIMULATION</div><h3 id="rights-dashboard-title">Know who can act next.</h3></div><span class="pill">No real tokens</span></div><div class="rights-grid">${keyValue('Action owner',e(owner))}${keyValue('Permitted next step',e(action))}${keyValue('Current deadline',e(deadline))}${keyValue('Fallback',disputed?'Frozen milestone':o.fundedAt?'Buyer refund may be eligible after the documented grace period':'No funds at risk')}</div><p class="rights-caveat"><strong>Important:</strong> ${e(fallback)}</p></section>`;
}
function evidenceGuidance(o,m){
 if(!m||m.status!=='disputed')return '';
 const criteria=Array.isArray(m.criteria)&&m.criteria.length?m.criteria:['No acceptance criteria were preserved for this legacy sandbox milestone.'];
 const delivery=m.deliveries?.at(-1);
 return `<section class="evidence-room panel soft mt20" data-evidence-room aria-labelledby="evidence-room-title-${e(m.id)}"><div class="eyebrow">EVIDENCE-GUIDED RESOLUTION · SIMULATION</div><div class="row between"><h3 id="evidence-room-title-${e(m.id)}">Review the claim criterion by criterion.</h3><span class="pill warn">No automatic decision</span></div><p class="small mt12">Separate what the agreement says from what a party claims. A reviewer must inspect the source material; this panel never releases or refunds funds by itself.</p><ol class="evidence-list">${criteria.map((criterion,index)=>`<li><span class="evidence-index">${index+1}</span><div><strong>${e(criterion)}</strong><p>${delivery?`Latest seller delivery recorded ${timestamp(delivery.at)}. Check the submitted description and evidence reference against this criterion.`:'No delivery has been recorded. Request the missing delivery account before deciding.'}</p></div></li>`).join('')}</ol><div class="evidence-gaps"><strong>Missing or unverified in this sandbox</strong><ul><li>Original files and external links are not privately stored or fetched.</li><li>Identity, timestamps, inspection results, and translations require independent verification.</li><li>Reviewer rationale must cite the agreement and evidence; it cannot invent a split or destination.</li></ul></div></section>`;
}

  ${U.shippingPanel(o)}${realEstatePanel(o)}${o.workflow==='domain_sale'?domainTransferPanel(o):''}<div class="row between mb20"><h3>Your milestones</h3><span class="tiny muted">${count} of ${o.milestones.length} settled · green means released</span></div>

function termHistoryBlock(m){if(!Array.isArray(m.termsHistory)||!m.termsHistory.length)return '';const prior=m.termsHistory.slice().reverse();return `<details class="terms-history"><summary>Terms history · ${m.termsHistory.length} accepted amendment${m.termsHistory.length===1?'':'s'}</summary><p class="tiny muted terms-history-intro">Read-only record of what changed. The original agreement remains preserved; this sandbox does not create a blockchain transaction or legal amendment.</p><div class="terms-history-list">${prior.map((h,i)=>`<article class="terms-history-entry"><div class="row between"><strong>Previous terms · version ${m.termsHistory.length-i}</strong><span class="tiny muted">${h.at?date(h.at):'Recorded amendment'}</span></div><div class="terms-history-fields"><div><span class="row-label">Scope</span><p>${e(h.scope||'Not recorded')}</p></div><div><span class="row-label">Acceptance checklist</span>${listChecks(Array.isArray(h.criteria)?h.criteria:[])}</div><div><span class="row-label">Deadline</span><p>${h.dueAt?date(h.dueAt):'Not set'}</p></div><div><span class="row-label">Principal held then</span><p>${h.held?`${fmt(h.held)} demo`: 'Not recorded'}</p></div></div></article>`).join('')}</div><article class="terms-history-entry current"><div class="row between"><strong>Current terms · active</strong><span class="pill green">In force</span></div><div class="terms-history-fields"><div><span class="row-label">Scope</span><p>${e(m.scope||'Not recorded')}</p></div><div><span class="row-label">Acceptance checklist</span>${listChecks(Array.isArray(m.criteria)?m.criteria:[])}</div><div><span class="row-label">Deadline</span><p>${m.dueAt?date(m.dueAt):'Not set'}</p></div><div><span class="row-label">Principal held now</span><p>${m.held?`${fmt(m.held)} demo`:'Not recorded'}</p></div></div></article></details>`;}
function milestoneCard(o,m,index){const a=actor(),buyer=a.id===o.buyerId,seller=a.id===o.sellerId,admin=a.role==='admin',party=buyer||seller,live=o.fundedAt&&!['released','refunded','settled'].includes(m.status),attrs=`data-order="${e(o.id)}" data-milestone="${e(m.id)}"`,latest=m.deliveries.at(-1),q=m.proposal,pending=q?.status==='pending'&&q.expiresAt>Date.now();

 if(live){
  if(seller&&!o.commerce&&o.workflow!=='domain_sale'&&m.status==='funded')actions+=button(`${icon('download')} Submit delivery`,'delivery',attrs,'btn-primary');
  if(buyer&&o.workflow!=='domain_sale'&&m.status==='submitted'&&(!o.commerce||!o.fulfillment.returnStatus)){actions+=button(`${icon('check')} Approve & release`,'approve',attrs,'btn-primary');if(m.revisionsUsed<o.snapshot.revisions)actions+=button('Request revision','revision',attrs);}

  if(buyer&&m.status==='funded'&&(!o.commerce||!o.fulfillment.shippedAt)&&Date.now()>m.dueAt+2*DAY)actions+=button('Claim no-delivery refund','late-refund',attrs,'btn-danger btn-small');
 }
 return `<article class="milestone ${e(m.status)}"><div class="milestone-top"><div class="row"><span class="milestone-number">${['released','settled'].includes(m.status)?icon('check'):index+1}</span><div><h3>${e(m.title)}</h3><div class="milestone-meta">${o.fundedAt?`Due ${date(m.dueAt)}`:'Not funded'} · ${m.revisionsUsed}/${o.snapshot.revisions} revisions used${m.termsHistory.length?' · amended terms':''}</div></div></div><div><div class="milestone-money">${fmt(o.fundedAt?(live?m.held:sum([m.sellerPaid,m.buyerRefunded])):m.originalAmount)} <span class="tiny muted">${e(o.asset)}</span></div><div class="text-right mt12">${pill(m.status)}</div></div></div>
  <details ${m.status==='submitted'||m.status==='disputed'?'open':''}><summary>Scope & acceptance checklist</summary><p class="scope-text">${e(m.scope)}</p>${listChecks(m.criteria)}</details>

function resolution(){const admin=actor().role==='admin',orders=state.orders.filter(o=>admin||[o.buyerId,o.sellerId].includes(actorId)),cases=orders.flatMap(o=>o.milestones.filter(m=>m.status==='disputed').map(m=>({o,m}))),pending=state.listings.filter(l=>l.status==='pending');

function rules(){return `<main id="main" class="container"><div class="page-head"><div class="eyebrow">Know the agreement</div><h1>Clear rules. Limited authority.</h1><p>This is the proposed policy used by the executable sandbox. These are product assumptions, not legal terms or an audited blockchain guarantee.</p></div><div class="panel danger mb20"><h3>Do not send money to this prototype.</h3><p class="small mt12">The escrow has no real wallets, token approvals, contracts or funds. The separate payment hub can connect an external wallet and load external swap/on-ramp tools only when enabled; these never credit demo escrow. Demo identities are switchable. The local server has no production authentication; the standalone preview stores data in your browser.</p></div><section class="panel soft mb20"><div class="eyebrow">PLANNED DECENTRALIZED MODEL</div><h3>Marketplace infrastructure, not a custodian.</h3><p class="small mt12">In the planned production version, a decentralized escrow program would enforce the agreement’s permitted release and refund paths. Escrow Global would provide marketplace and agreement infrastructure, not hold customer funds or control a pooled balance. A separate third-party arbiter would handle contested disputes within the authority granted by the agreement; the arbiter could not arbitrarily redirect funds or rewrite the terms. This build is only a sandbox: it has no live custody, deployed program or real arbitration.</p><a class="text-link mt20" href="#/learn/non-custodial">Read the non-custodial escrow guide ${icon('arrow')}</a></section>
 <div class="rule-grid"><section class="panel"><div class="eyebrow">Fees</div><h3>Your 3% + 5% model</h3>${keyValue('Platform commission','3% of principal released to seller')}${keyValue('Who funds that fee?','Buyer adds a fee reserve')}${keyValue('Refunded principal','Unused 3% reserve also refunded')}${keyValue('Formal dispute','Initiator pays an additional 5%')}${keyValue('Dispute calculation base','Only the disputed milestone principal')}<p class="small mt20">The dispute charge is non-refundable in this prototype, even for a successful claimant. This preserves the paid-dispute model rather than silently changing it into a refundable bond. Both sides must see and accept the policy before funding.</p><p class="tiny mt12">Amounts use integer micro-units. Percentage fees round down at six decimal places per milestone. No hidden card, bridge, or network fee is simulated. The same 3% + 5% policy applies equally to USDT-denominated agreements.</p></section><section class="panel"><div class="eyebrow">An example</div><h3>A 1,000 USDC agreement</h3>${keyValue('Buyer deposits','1,030 USDC')}${keyValue('Full completion','Seller 1,000 / platform 30')}${keyValue('Full refund before a dispute','Buyer receives 1,030')}${keyValue('Final 600 / 400 principal split','Seller 600 / buyer 412 / platform 18')}${keyValue('Dispute over the full 1,000','Claimant separately pays 50')}<p class="small mt20">A partial split requires both parties. Your team cannot invent a 600/400 award. The initiator’s dispute charge is separate from these principal and commission figures.</p></section></div>
 <section class="panel mt28"><h3>Who can do what?</h3><table class="rules-table mt20"><thead><tr><th>Action</th><th>Authorized actor</th><th>Payment destination</th></tr></thead><tbody><tr><td>Accept submitted work</td><td>Original buyer</td><td>Original seller</td></tr><tr><td>Release a disputed milestone</td><td>Review team</td><td>Original seller</td></tr><tr><td>Refund a disputed milestone</td><td>Review team</td><td>Original buyer</td></tr><tr><td>Approve a split or revised scope</td><td>Both original parties</td><td>Same two original parties</td></tr><tr><td>Change payout wallet or sweep funds</td><td>Nobody through this workflow</td><td>Not supported</td></tr><tr><td>Earn disclosed commission / dispute charge</td><td>Fixed fee formula</td><td>Fixed platform fee recipient</td></tr></tbody></table></section>
 <div class="rule-grid mt28"><section class="panel"><h3>What makes a milestone complete?</h3><p class="small mt12">A funded balance is not proof of completion. In manual mode, the buyer must approve a submitted delivery. In timed mode, both parties pre-agree to a 72-hour review period; after that deadline, an execution action can release an undisputed milestone. No AI, file upload, server badge, or reviewer button can silently turn an ordinary delivery into approval.</p><p class="small mt12">No-submission refunds become available to the buyer after the delivery deadline plus a 48-hour grace period. A revision request uses an included revision and gives at least three more days for redelivery. A formal dispute blocks both automatic-review release and no-delivery refunds.</p></section><section class="panel"><h3>Renegotiate, without rewriting history.</h3><p class="small mt12">Either party may propose a final split or revised retained amount, scope, and deadline. Proposals expire in 72 hours. No money moves on proposal alone. The original counterpart must accept the same current proposal. Delivery or dispute changes invalidate pending offers.</p><p class="small mt12">A revised agreement can refund part of the remaining principal and keep the rest locked. The original snapshot stays unchanged; the milestone records current terms and amendment history. Neither party nor the team can substitute payment identities.</p></section></div>
 <section class="panel soft mt28"><h3>Before this could handle real money</h3><p class="small mt12">Replace the simulated ledger and identity picker with authenticated accounts, wallet ownership proofs, and an audited escrow program that enforces the same restrictions. Add isolated private evidence storage, moderation and sanctions controls as legally required, reliable transaction reconciliation, multisignature review authority, resolver deadlines and fallback procedures, observability, backups, and legal review for the operator’s jurisdiction.</p><p class="small mt12">A live upgrade authority must not be able to replace these payout restrictions. A database or frontend rule is not equivalent to an immutable on-chain restriction. This build does not claim otherwise.</p></section></main>`;}

function field(label,name,type='text',value='',help='',attrs=''){
 const element=type==='textarea'?`<textarea id="field-${e(name)}" name="${e(name)}" ${attrs}>${e(value)}</textarea>`:`<input id="field-${e(name)}" type="${type}" name="${e(name)}" value="${e(value)}" ${attrs}>`;
 return `<div class="field"><label for="field-${e(name)}">${label}</label>${element}${help?`<div class="help">${help}</div>`:''}</div>`;
}
const selectField=(label,name,options,help='')=>`<div class="field"><label for="field-${e(name)}">${label}</label><select id="field-${e(name)}" name="${e(name)}">${options}</select>${help?`<div class="help">${help}</div>`:''}</div>`;
const acceptanceField=()=>selectField('How can payment be released?','acceptance','<option value="manual">Buyer explicitly approves submitted work</option><option value="timed">72-hour review period, unless a dispute is filed</option>','Both parties must accept this rule. A timed release still needs an execution transaction/action.');
const feePolicy=()=>`<div class="fee-note">Prototype policy: buyer funds principal plus a 3% reserve; commission is earned only on principal paid to the seller. A formal dispute adds a separate, non-refundable 5% charge to the person opening it.</div>`;
const readinessPanel=()=>`<section class="agreement-preflight" data-readiness-panel aria-live="polite"><strong>Agreement preflight</strong><p>Start typing to check for missing scope, acceptance, deadline and amount details.</p></section>`;
function refreshReadiness(form){
 const panel=form?.querySelector('[data-readiness-panel]');if(!panel)return;
 const v=Object.fromEntries(new FormData(form));const result=checkAgreementReadiness({scope:v.scope,acceptance:v.criteria,deadline:v.days,remedy:'revision or refund',amount:v.amount,asset:modalContext?.asset||selectedAsset});
 const heading=result.ready?'Core details are present.':'Complete the required details before creating the draft.';
 panel.innerHTML=`<div class="preflight-title">Agreement preflight</div><strong>${e(heading)}</strong><p>${result.counts.error} required · ${result.counts.warn} suggestions · advisory only</p>${result.issues.length?`<ul>${result.issues.slice(0,5).map(item=>`<li class="${item.severity}"><span>${item.severity==='error'?'Required':'Suggestion'}</span> ${e(item.message)}</li>`).join('')}</ul>`:'<p class="preflight-ok">✓ No core gaps detected. Both parties still review the exact terms.</p>'}`;
}
