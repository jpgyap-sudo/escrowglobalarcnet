   Appended section. No cascade overrides of earlier rules.
   ============================================================ */
.u-hero-scene-photo{position:relative;padding:0;overflow:hidden;border-radius:20px;background:var(--brand-soft);min-height:340px}

.u-hero-picture{display:block;width:100%;height:100%;margin:0}

.u-hero-picture img{display:block;width:100%;height:100%;object-fit:cover;border-radius:20px}

.u-hero-chips{position:absolute;top:16px;right:16px;display:flex;gap:6px;z-index:2}

.u-hero-chip{background:var(--brand-surface);color:var(--brand-primary);border:1px solid var(--brand-border);border-radius:30px;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.6px}

.u-hero-demo-badge{position:absolute;left:16px;bottom:16px;background:#102a43e6;color:#ddf4f2;border-radius:30px;padding:7px 13px;font-size:11px;font-weight:600;letter-spacing:.4px;z-index:2}

.u-contract-copy{position:relative;z-index:1}

.u-contract-art{display:block;width:100%;max-width:360px;height:auto;margin:22px auto 0;border-radius:10px;box-shadow:0 12px 30px #102a4314}

@media(max-width:900px){
  .u-hero-scene-photo{min-height:280px}

  .u-contract-art{max-width:320px}

}

@media(max-width:680px){
  .u-hero-scene-photo{min-height:230px;border-radius:16px}

  .u-hero-picture img{border-radius:16px}

  .u-hero-chip{font-size:10px;padding:5px 10px}

  .u-hero-demo-badge{font-size:10px;padding:6px 11px}

}


/* Escrow Global: asset controls and responsive composition. */
.header-inner{min-height:84px;height:auto;gap:14px;flex-wrap:nowrap}

{id:'production-readiness',tag:'Start here',title:'What is built — and what is still gated?',time:'4 min',intro:'Use this checklist to tell the difference between a working demonstration, a verified local artifact, and a production escrow service that is safe to enable.',steps:[['Working demo','The marketplace, agreement flows, simulated balances, tutorials, action center, payroll sandbox and support surfaces run locally. They are useful for learning, but a demo identity is not a real account and a simulated balance is not a token balance.'],['Verified building blocks','The repository has a constrained Anchor program, generated ABI, unsigned intent builders, read-only RPC transport, finalized reconciliation, transaction retry states, PostgreSQL schema boundaries and an operator gateboard. Each component still needs integration in a controlled deployment.'],['What “deployed” means','A fresh local SBPF artifact proves compilation, not that a program exists on a cluster. Production requires an approved network manifest, matching program identity, verified deployment, upgrade-authority policy, monitoring and an independent audit.'],['What “funded” means','A wallet signature or provider redirect is not proof. A production worker must fetch finalized chain data, verify the exact program instruction, PDA, mint, token program, signer, amount, vault and terms commitment, then write one idempotent ledger record.'],['Enable only after every gate','Authentication, private evidence storage, dispute staffing, backups, alerts, legal/compliance approval, limits and release approval must all be ready. Until then, the safe answer is “sandbox only”—never send tokens to this prototype.']],note:'The gateboard is intentionally fail-closed. Current live custody remains disabled: no production deployment, audit, live escrow endpoint, or real-money transaction has been performed.',sources:[['Solana deployment guide','https://solana.com/docs/programs/deploying'],['Solana core concepts','https://solana.com/docs/core'],['Anchor references','https://www.anchor-lang.com/docs/references']]},
{id:'solana-escrow-simple',tag:'Start here',title:'Solana escrow in simple terms',time:'5 min',intro:'Think of escrow as a locked box with clear instructions: the buyer puts tokens in, the seller does the work, and the program releases or returns funds only through the rules agreed beforehand.',steps:[['The simple analogy','A normal escrow agent holds money and decides when to release it. A Solana program is a public rulebook that runs on the blockchain. It does not understand whether a chair is beautiful or a website is good; people still provide the agreement and evidence.'],['Create the locked box','The buyer, seller, token mint, amount, fee reserve, deadlines and terms hash are recorded. A program-derived address (PDA) identifies the agreement and its token vault. The destinations are fixed before funding.'],['Fund only after review','The buyer’s wallet signs a transaction that transfers the exact agreed amount and reserve into the vault. A wallet popup is only a request to sign; production software must wait for finalized chain evidence and reconcile the exact program, vault, mint and amount.'],['Deliver and decide','The seller submits delivery evidence. The buyer checks the acceptance list and either approves, requests a remedy, or opens a dispute. A delivery notification alone should never release funds.'],['Release, refund or dispute','If the rules are satisfied, the program pays only the original seller and fixed fee recipient. If an eligible refund is accepted, it returns funds only to the original buyer. A constrained arbiter may choose only the outcomes the agreement allows; it cannot invent a recipient or an arbitrary split.']],note:'This guide explains the planned production model. The current website is a local sandbox: it has simulated balances, no live vault, no deployed production program and no real buyer protection. Never send tokens to this prototype.',sources:[['Solana core concepts','https://solana.com/docs/core'],['Solana financial products guide','https://solana.com/docs/finance'],['Anchor security references','https://www.anchor-lang.com/docs/references/security-exploits']]},
{id:'first-deal',tag:'Start here',title:'Your first protected agreement',time:'4 min',intro:'Agree first. Fund second. Release only under the agreed rules. This build uses simulated escrow funds.',steps:[['Choose a starting point','Buy a listed product, hire a service, accept a project offer, or create a private agreement with an existing counterparty.'],['Write a measurable agreement','Specify the goods or deliverables, quantities, acceptance tests, delivery deadline, inspection period and who covers shipping or revisions.'],['Confirm both parties','The seller accepts the exact agreement. Fixed buyer and seller identities determine every refund and payout. Never assume an unfunded milestone is protected.'],['Fund, deliver and inspect','In this build, the buyer funds the agreement’s selected demo USDT or USDC plus a 3% reserve. The pricing selector never changes an existing agreement’s asset. Use the delivery workflow, then approve only what meets the agreed checklist.'],['Resolve an issue','Try a revision, return request or signed amendment first. A formal dispute costs the initiator another non-refundable 5% of the held principal in that milestone. The review team can release or refund it, not redirect it.']],note:'Escrow Global is a working local sandbox. It does not currently custody tokens or provide real buyer protection.',sources:[]},
{id:'fee-breakdown',tag:'Payments',title:'Understand the fee and refund math',time:'3 min',intro:'See exactly how the buyer fee reserve, seller payout and refund interact before funding a milestone.',steps:[['Start with the principal','The principal is the amount intended for the seller when the agreed work is released. In the example, the principal is 1,000 demo USDC.'],['Add the disclosed reserve','The buyer adds a 3% commission reserve, so the simulated funding total is 1,030. The reserve is not hidden and is kept separate from seller principal.'],['Release accepted work','When the current acceptance conditions are approved, the seller receives the released principal and the platform receives the formula-based commission from the reserve.'],['Refund without release','If the milestone is refunded before a dispute, the buyer receives the principal plus any unused reserve. A partial settlement returns the unresolved remainder according to the recorded proposal.'],['Treat disputes separately','A formal dispute charge is an additional 5% of the disputed milestone principal in this prototype. It is not taken from the seller payout or treated as a refundable bond.']],note:'All amounts in this guide are simulated integer token units. The policy is a product prototype, not a legal, tax or financial guarantee.',sources:[]},
{id:'non-custodial',tag:'Why Escrow Global',title:'What non-custodial escrow means',time:'4 min',intro:'Escrow Global is planned as decentralized settlement infrastructure: the marketplace helps parties make the deal, while program rules—not a company-held balance—control how funds can move. The current build is a local sandbox with no live custody or deployed decentralized program.',steps:[['A decentralized design','In the planned production architecture, a decentralized on-chain escrow program would lock funds under the agreement’s pre-agreed conditions. Escrow Global would not hold the funds in a company bank account or controlled wallet, and could not unilaterally withdraw, reroute or sweep them.'],['Marketplace infrastructure, not a custodian','Escrow Global’s role is to help people discover counterparties, define measurable terms, create an agreement, track evidence and coordinate settlement. The platform provides the rails and interface; it is not the owner of the funds being exchanged.'],['A third-party arbiter handles disputes','When facts are contested, an independent third-party arbiter would review the evidence and decide within the authority granted by the agreement. The arbiter could not send funds to an unrelated party, rewrite the original terms or exceed the program’s permitted outcomes; the decentralized program would enforce the result.'],['Different from traditional third-party escrow','Traditional escrow places funds with a licensed intermediary that holds and releases them. The planned non-custodial model replaces open-ended custody with verifiable program logic and a narrowly scoped arbiter. This can reduce platform-custody risk, but it requires clearer terms and does not remove the need for legal or regulatory compliance.'],['Benefits and tradeoffs','Potential benefits include user-controlled wallets, transparent and auditable settlement rules, constrained operator power, and 24/7 cross-border settlement potential. Tradeoffs include smart-contract risk, wallet and network risk, irreversible transactions, arbiter dependence for disputed facts, and greater responsibility on the parties. The current build demonstrates the workflow only; it does not move real funds or provide real buyer protection.']],note:'Use “planned decentralized/non-custodial architecture” for the production roadmap. The current sandbox has no live custody, no deployed escrow program and no real third-party arbitration.',sources:[]},
{id:'funding-safely',tag:'On-chain readiness',title:'How a future escrow funding transaction works',time:'4 min',intro:'A safe escrow flow separates agreement review, wallet signing, transaction submission, finality and reconciliation. This guide explains the sequence without pretending this sandbox sends tokens.',steps:[['Review the exact intent','Confirm the agreement ID, current terms version, buyer and seller wallets, token mint, network, principal, 3% reserve and fixed destinations. A visual balance or browser callback is not enough.'],['Open the wallet review','A future client would construct an unsigned transaction from the verified intent. Your wallet—not the marketplace—must show the program, mint, amount and recipient accounts before you approve it.'],['Sign only what you understand','The wallet signature authorizes the specific transaction bytes. Never paste a seed phrase into an app, and never treat a terms hash alone as a party signature.'],['Wait for independent finality','A submitted transaction is pending, not funded. A reconciler should verify the correct program instruction, vault, mint, payer, amount and finalized chain status before the agreement becomes funded.'],['Resume safely after failure','If the blockhash expires, the RPC fails or the wallet rejects the request, retry the same operation only through a new transaction attempt. Do not double-credit because a previous HTTP response was lost.']],note:'The current build includes unsigned intent validation and a transaction lifecycle model, but no RPC client, wallet broadcast, deployed program or real token movement.',sources:[]},
{id:'physical-goods',tag:'Products',title:'Buy and sell physical products',time:'4 min',intro:'A tracking number is evidence of a shipment, not proof that the correct item arrived in good condition.',steps:[['Check the specification','Agree material, dimensions, model or serial number, quantity, condition, packing, delivery area and shipping charges. For wholesale, specify sample approval and inspection responsibility.'],['Reserve stock by funding','A product agreement is not a stock reservation until funding succeeds. The sandbox rechecks inventory at funding to prevent overselling.'],['Record shipment','The seller adds carrier, tracking and a packing-evidence reference. Carrier events entered here are seller-reported, not verified logistics API results.'],['Confirm receipt, then inspect','Only the buyer confirms receipt to start the inspection window. Receipt itself releases nothing. Approve the delivery milestone only after inspecting against the checklist.'],['Handle a return or holdback','A return request is free, but does not automatically refund. Agree logistics, record return shipment, and accept the seller’s refund offer or use formal dispute resolution. A warranty holdback is released only by the buyer after its period, or resolved by agreement/dispute.']],note:'Real addresses and shipment evidence require private storage in production. This demo stores references and optional file digests, not private documents.',sources:[]},
{id:'buy-crypto',tag:'Payments',title:'Buy USDC or USDT with a card or bank',time:'4 min',intro:'An on-ramp buys crypto into your own wallet. It does not fund an Escrow Global escrow or make a delivery acceptable.',steps:[['Select your own Solana wallet','Use a wallet you control. Check the receiving address carefully. Never paste a seed phrase or private key into Escrow Global or a provider form.'],['Choose a token and provider','The Buy screen offers a configured MoonPay checkout and links to independent alternatives. Always select USDC or USDT specifically on Solana—not Ethereum, Tron or another network.'],['Verify with the provider','The provider may request identity verification, residency information and payment-method checks. Complete these on the provider’s official domain. Escrow Global does not process your card details or identity documents.'],['Review the final quote','Card, Apple Pay, Google Pay and bank availability depends on country, device, asset and provider approval. Compare the fiat total, provider fees, network costs and exact tokens received before confirming.'],['Confirm the deposit separately','Wait for the tokens to reach your own wallet. Then a production escrow would need a separate verified funding transaction. This demo has no live custody contract; do not send money to its demo identifiers.']],note:'MoonPay sandbox requires partner test keys. Live MoonPay requires approval, network-specific currency codes, signed URLs and IP matching; those requirements cannot be replaced with a demo payment callback.',sources:[['MoonPay hosted integration','https://dev.moonpay.com/widget/on-ramp/integration-methods/url'],['MoonPay parameters','https://dev.moonpay.com/widget/on-ramp/customization/parameters'],['MoonPay URL signing','https://dev.moonpay.com/widget/on-ramp/customization/url-signing']]},
{id:'swap',tag:'Payments',title:'Swap into USDC or USDT with Jupiter',time:'3 min',intro:'The Jupiter panel is a separate, opt-in mainnet integration. A successful swap does not add funds to your simulated Escrow Global balance.',steps:[['Open Wallet → Swap','Start the local server rather than the offline file. Read the live-transaction warning and explicitly enable the official Jupiter Plugin. Native templates keep this disabled pending integration and store review.'],['Connect a supported wallet','Jupiter’s interface handles its own connection and transaction approval. Escrow Global does not receive your seed phrase. Check the wallet, network and token mints.'],['Review and sign','Choose the input asset, output USDC or USDT, amount and acceptable slippage. Review the route, price impact, fees and transaction in the wallet before signing.'],['Check the result','Confirm output tokens in your wallet. Keep sufficient SOL for transactions that need it. Never assume every route is gas-sponsored or that a wallet top-up means an escrow is funded.']],note:'The supplied integration loads the official plugin only after consent. A real mainnet transaction was not executed in the included test run.',sources:[['Official Jupiter Plugin','https://developers.jup.ag/docs/tool-kits/plugin'],['Official HTML integration example','https://developers.jup.ag/docs/tool-kits/plugin/html-app-example']]},
{id:'jupiter-register',tag:'Jupiter Spend',title:'Register for Jupiter Global / Spend',time:'3 min',intro:'Jupiter’s current documentation calls the spending product “Spend”. Your DeFi wallet and your Spend balance are different.',steps:[['Use Jupiter’s official app entry point','Open the official Jupiter site and follow its app-store links. Check publisher details. Do not use an unsolicited download or a support agent’s link.'],['Set up Jupiter ID','In the app, open your profile and choose Set up Jupiter ID. The documented sign-in options include email, Google and Apple.'],['Open the Verification Center','Complete the in-app eligibility flow. Available products depend on residency and the issuer assigned to you. Do not assume that holding a wallet means you are eligible for a card.'],['Keep the balances distinct','Supported deposits into Spend are converted to USD at deposit. A DeFi wallet balance does not automatically become Spend funds, and Spend is not your Escrow Global escrow.']],note:'Interface labels and availability may change. Follow the current official app and the linked guide. Escrow Global is independent and is not an issuer or authorized Jupiter merchant integration.',sources:[['Jupiter Spend overview','https://docs.jup.ag/user-docs/global/spend']]},
{id:'jupiter-kyc',tag:'Jupiter Spend',title:'Complete verification safely',time:'3 min',intro:'KYC is performed inside Jupiter’s official flow and its verification provider—not by uploading identity documents to this demo.',steps:[['Check eligibility first','The documented minimum age is 18. Confirm your actual country of residence and eligibility; do not misstate your location.'],['Prepare your own documents','The flow can request a government identity document, phone verification, personal information, a questionnaire and a liveness check. The current APAC flow also requires proof of address.'],['Complete the official verification flow','Use the Verification Center and follow the SumSub verification prompts. Keep document information consistent with your real details and use a clear, unedited capture.'],['Check status in the app','Manual review may take longer than automated verification. Follow official requests for additional information; no approval or processing time is guaranteed.'],['Protect your recovery information','A legitimate KYC request does not need your wallet seed phrase. Never send credentials to Escrow Global, a chat contact or an unofficial “verification agent”.']],note:'Escrow Global does not perform Jupiter KYC, store your identity files, or bypass issuer restrictions.',sources:[['Jupiter Spend overview','https://docs.jup.ag/user-docs/global/spend'],['Jupiter Spend FAQ','https://docs.jup.ag/user-docs/global/spend/faq']]},
{id:'jupiter-card',tag:'Jupiter Spend',title:'Fund and use a Jupiter card',time:'3 min',intro:'Spend provides a Visa debit-card product for eligible users. Issuer, country support, fees and limits must be checked in the app.',steps:[['Check the assigned issuer','Your residence determines the applicable issuer and product availability. Do not assume that two users receive the same card features.'],['Follow the exact deposit instructions','In Spend, choose the supported token and network, then copy the displayed address. Confirm with a small transfer when appropriate. Never send unsupported assets or use the Escrow Global demo address.'],['Review the USD conversion','Spend converts supported crypto deposits into its USD balance. Check the displayed exchange terms and any fees before depositing.'],['Use card controls','View details privately, freeze the card when necessary, and add it to Apple Wallet or Google Wallet only where the app offers that option. Check spending limits and foreign-currency charges.'],['Know the payment boundary','A card purchase pays the merchant through card rails. It is not an on-chain Escrow Global escrow funding event. An on-ramp may reject a given card; do not assume the Jupiter card can buy crypto.']],note:'The documentation currently describes digital cards. Do not promise a physical card, cashback level or card approval based on this tutorial.',sources:[['Jupiter card guide','https://docs.jup.ag/user-docs/global/spend/jupiter-card'],['Jupiter Spend deposit details','https://docs.jup.ag/user-docs/global/spend']]},
{id:'jupiter-qr',tag:'Jupiter Spend',title:'Pay a local merchant with Jupiter QR Pay',time:'3 min',intro:'Merchant QR Pay and a Solana wallet QR are different payment systems. This app does not issue Jupiter merchant QR codes.',steps:[['Confirm the feature is available','QR Pay currently depends on your card issuer, country and sometimes issuance date. Check the app and official support table; some corridors are temporarily unavailable.'],['Open the scanner in Spend','Use the Spend screen’s scan control and scan a supported merchant QR. Do not assume every QR image is compatible.'],['Check merchant and amount','Verify the merchant name, local-currency total, conversion and fees before authorizing. QR Pay draws from your Spend USD balance.'],['Keep the receipt','Save the in-app transaction reference. A merchant payment receipt is not proof that an Escrow Global vault was funded.'],['For Escrow Global wallet top-ups, use the other QR','Escrow Global’s Receive page creates a Solana Pay-style transfer request for your own wallet. Wallet compatibility varies, and this is neither Jupiter merchant acquiring nor escrow settlement.']],note:'No merchant onboarding or acquiring API is configured in this project. The Jupiter QR section is an instructional guide, not a live merchant-payment integration.',sources:[['Jupiter QR Pay support and instructions','https://docs.jup.ag/user-docs/global/spend/qr-pay'],['Solana Pay transfer requests','https://solana.com/docs/tools/solana-pay/quickstart/transfer-requests']]},
{id:'wallet-qr',tag:'Payments',title:'Receive a Solana wallet transfer by QR',time:'2 min',intro:'Create a QR that asks a compatible wallet to transfer USDC or USDT to an address you control. This bypasses escrow protection.',steps:[['Use your own receiving address','The Receive form accepts a Solana wallet address and optional exact amount. Check the full address; the software validates its format, not who owns it.'],['Choose the correct stablecoin','The request includes the canonical Solana mint. The same ticker on another network is not interchangeable.'],['Review the decoded request','The payer’s wallet must show the same recipient, mint and amount. A QR can be copied or replaced; visual appearance is not a security guarantee.'],['Verify receipt on-chain','A screenshot or “paid” message is not enough. Production accounting must verify token, recipient, amount and transaction finality independently. This build does not monitor deposits.']],note:'Never describe this receive QR as an escrow deposit address. Live escrow requires a deployed contract, instruction verification and reconciliation.',sources:[['Solana Pay specification','https://docs.solanapay.com/spec'],['Circle USDC addresses','https://developers.circle.com/stablecoins/usdc-contract-addresses'],['Tether supported protocols','https://tether.to/en/supported-protocols/']]},
{id:'clear-scope',tag:'Better agreements',title:'Escrow development, marketing and contracts',time:'4 min',intro:'Define observable work instead of promising a result that neither party controls.',steps:[['Development','Name repositories, supported platforms, acceptance tests, source-code ownership, credentials handover and defect period. Break discovery, build and handover into separate milestones.'],['Marketing','Specify asset count, placements, dates, approval rights, advertising-spend responsibility and reporting access. Separate the agency fee from ad spend. Never require fake engagement or market manipulation.'],['Contracts and procurement','Fund a defined payment obligation—not “the legal contract” itself. Specify deliverables, document versions and a named inspector where necessary. Title transfers and regulated trust obligations need a separate legal framework.'],['Deposits and warranty balances','Define what can be deducted, the inspection evidence, time limits and the decision process. Do not advertise interest, insurance or a guaranteed refund.'],['Digital handover','List transferable domain or source-asset rights and required handover steps. Do not trade accounts or licences that cannot legally be transferred.']],note:'Templates are workflow starting points, not jurisdiction-specific legal advice. Do not use this demo for securities, regulated escrow, illegal goods or customer funds.',sources:[]},
{id:'milestone-planning',tag:'Better agreements',title:'Design milestones that are easy to approve',time:'4 min',intro:'A good milestone is small enough to inspect, specific enough to test, and clear about what happens when the result misses the mark.',steps:[['Name the outcome','Describe the finished result, not just the activity. Include format, quantity, owner and handover location.'],['Split the work','Use stages that can be accepted independently. Avoid one giant final milestone that hides all the risk until the end.'],['Write the test','Add objective acceptance checks and identify the evidence a reviewer can inspect. “Looks good” is not a durable rule.'],['Choose the remedy','Agree revision rounds, cure periods, return logistics or refund conditions before funding.'],['Confirm together','Both parties should accept the exact version and asset before any future live wallet flow begins.']],note:'The current Anchor slice supports one principal per escrow; the marketplace can model multiple sandbox milestones, but live multi-milestone custody still requires an audited v2 program.',sources:[]},
{id:'dispute-safely',tag:'Resolution',title:'Handle a dispute without losing the facts',time:'4 min',intro:'A dispute should freeze only the contested milestone while preserving the agreement, evidence and both parties’ responses.',steps:[['Pause the right scope','Identify the exact milestone and do not imply that unrelated completed work is automatically frozen.'],['Build a timeline','Keep delivery references, messages, amendments and evidence digests in chronological order. Do not upload secrets or private identity documents.'],['Invite a response','Give the other party a clear question and a reasonable response window. A disagreement is not proof of fraud.'],['Apply the rule','Use the written acceptance test and the agreed remedy. A reviewer should not invent a new destination or rewrite the terms.'],['Record the outcome','Explain whether the result is release, refund, revision or continued hold. Keep an immutable audit trail in production.']],note:'The sandbox reviewer is a demo identity. Production disputes require authenticated parties, a qualified operator or arbiter, liveness controls, legal review and a deployed constrained program.',sources:[]},
{id:'onchain-reconciliation',tag:'On-chain readiness',title:'How to verify a funding transaction',time:'4 min',intro:'A wallet popup saying “approved” is not the same as a verified escrow deposit. Independent reconciliation connects the signature to the exact program state.',steps:[['Capture the operation','Keep the intent hash, wallet signature, network and attempt number together. A lost HTTP response must not create a second credit.'],['Observe the chain','Look up the transaction through a trusted RPC and wait for the required confirmation or finality level.'],['Inspect the instruction','Verify the expected program, agreement PDA, buyer signer, mint, token program and exact amount.'],['Check the vault delta','Confirm the correct vault gained the expected amount and no unrelated account was credited.'],['Finalize once','Only then update the marketplace ledger. Reconciliation must be idempotent and alert on mismatches.']],note:'This repository includes intent validation, a transaction lifecycle model and a local journal, but no RPC client, chain indexer, live vault or automatic crediting.',sources:[]},
{id:'wallet-security',tag:'Wallet safety',title:'Read a Solana transaction before signing',time:'3 min',intro:'Treat every wallet request as a permission slip. Verify what it does, who receives assets and which network will execute it.',steps:[['Use a wallet you control','Escrow Global should never ask for a seed phrase, private key or recovery words.'],['Check the network and mint','USDC or USDT on another chain is not the Solana asset you intended to use.'],['Read the program and accounts','Confirm the program, agreement, vault and fixed party destinations. Reject unexpected approvals or arbitrary token transfers.'],['Sign only the intended bytes','A terms hash is a commitment, not a wallet signature. Never sign a blank or unexplained message.'],['Verify afterward','Use an independent explorer or RPC and keep the transaction signature. Pending, confirmed and finalized are different states.']],note:'The current app is a sandbox with simulated balances. Its external wallet tools are deliberately separate from escrow custody.',sources:[]},
{id:'protection-receipts',tag:'On-chain readiness',title:'Understand a protection receipt',time:'3 min',intro:'A good receipt helps both parties verify one agreement without pretending to prove product quality, company solvency or a live dispute outcome.',steps:[['Identify the agreement','Check the agreement ID, original/current terms commitment and version.'],['Check the asset','Confirm the exact mint, token program, network and held amount. Tickers alone are not enough.'],['Check recipients','Verify buyer refund, seller payout and fee destinations are the originally agreed wallets.'],['Check freshness','Look for the source, slot or timestamp, finality status and when the receipt was last reconciled.'],['Understand the limits','A receipt is a narrow proof about one agreement. It is not insurance, a trust score or a guarantee that an external item is genuine.']],note:'The current receipt is a sandbox view. A production receipt requires an independent indexer/reconciler and clearly labeled stale data.',sources:[]},
{id:'rights-deadlines',tag:'Resolution',title:'Know your rights and deadlines',time:'3 min',intro:'Use the deal room to see who can act next, what the current deadline means, and which fallback is still available without confusing a product screen for a guarantee.',steps:[['Read the action owner','The dashboard identifies the buyer, seller, review team or both parties. A role label is not a wallet signature.'],['Read the permitted action','Funding, delivery, approval, revision, dispute, refund and release have different authorities. Do not substitute a shortcut.'],['Check the clock','Delivery and review dates are commitments to verify. Browser timers do not execute blockchain transactions or create eligibility by themselves.'],['Prepare the evidence','Tie each claim to the acceptance checklist, delivery record, message and source material. Missing or unverified evidence stays visible.'],['Use the fallback carefully','A production fallback needs chain rules, a reconciler, a staffed case owner and an accessible fee policy. This sandbox provides none of those guarantees.']],note:'The rights dashboard and evidence guide are informational sandbox surfaces. Exported receipts are machine-labelled non-authoritative records.',sources:[]},
{id:'fee-sponsorship',tag:'Access and fees',title:'Understand sponsored transaction fees',time:'3 min',intro:'A sponsored fee can remove the need to buy SOL for an approved action, but it does not make custody free or give a sponsor permission to redirect funds.',steps:[['Separate the costs','A network fee pays for transaction execution. A platform commission or dispute charge is a separate product-policy amount.'],['Use a bounded sponsor','A future sponsor should pay only allowlisted claims or case-intake operations, with caps, monitoring and a user-paid fallback.'],['Check the signer','The sponsor pays fees; the original wallet still authorizes the action. Sponsorship must not replace buyer, seller or reviewer authority.'],['Expect failure handling','Failed transactions may still cost the sponsor. Retries need an operation ID and must not double-credit, reopen, or duplicate a dispute.'],['Read the current boundary','This sandbox has no sponsored Solana transactions. Formal disputes currently show the prototype’s separate 5% charge; a production hardship/access policy is still an approval gate.']],note:'Fee sponsorship is a proposed production capability, not an enabled feature. Never send SOL or stablecoins to this demo to unlock a remedy.',sources:[]},
{id:'action-center',tag:'Your workspace',title:'Use the Action Center without missing a deadline',time:'3 min',intro:'The Action Center turns the agreement state into a short, role-specific list of what to do next. It is a guide, not a blockchain notification or legal notice.',steps:[['Open My deals','The panel appears above your agreements and prioritizes urgent items, then attention items, then helpful updates.'],['Check your role','Buyers, sellers and reviewers see different prompts. A seller may need to accept or submit delivery; a buyer may need to fund, inspect or review.'],['Follow the deadline','A deadline prompt is derived from the local agreement record. It does not prove that a Solana transaction is eligible or execute anything automatically.'],['Open the deal room','Every prompt links to the existing agreement flow, where the current terms, fixed destinations, evidence and permitted actions remain visible.'],['Treat it as a checklist','Refresh after another party acts. Use the transaction signature, finality and independent reconciliation in a future production deployment—not this local prompt—as the source of truth.']],note:'The Action Center is a deterministic sandbox convenience. It does not send push notifications, contact users, change balances, or replace a production chain observer, authenticated case service or legal deadline notice.',sources:[]}

const visitorGuideEdits={
  'production-readiness':{tag:'Start here',title:'Before you start an escrow',time:'3 min',intro:'Use this quick checklist to understand a deal before you begin.',steps:[['Know the deal','Read the item or service, price, asset, deadline, acceptance checks and available remedies.'],['Know your role','The deal room shows whether it is your turn to accept, fund, deliver, inspect or respond.'],['Check the other party','Confirm who you are dealing with and keep important questions inside the agreement record.'],['Protect your wallet','Use a wallet you control. Review every payment request and never share recovery words or private keys.'],['Start safely','Practice with the sandbox first. Do not send real tokens or personal documents to this demo.']],note:'This website is an interactive sandbox. Balances and identities are examples only; no real funds move here. It is not a live escrow service, buyer-protection guarantee or source of legal or financial advice.',sources:[]},
  'solana-escrow-simple':{tag:'Start here',title:'How escrow works, simply',time:'4 min',intro:'Escrow gives both sides a clear order of events: agree, set funds aside, complete the work, then decide what happens next.',steps:[['Agree first','The buyer and seller review the description, amount, deadline, acceptance checks and refund or dispute options.'],['Set funds aside','In a real service, the agreed money stays separate while the work is completed. In this sandbox, the balance is only a demonstration.'],['Do the work','The seller delivers the item or service and adds the evidence the agreement asks for.'],['Review the result','The buyer checks the delivery against the agreed list and can accept it, request a remedy or ask for help.'],['Finish the deal','A permitted decision releases the seller payment, returns money to the buyer or keeps the disputed part on hold.']],note:'This website is an interactive sandbox. Balances and identities are examples only; no real funds move here. Never send tokens to this prototype. The website does not provide real custody or buyer protection.',sources:[]},
  'non-custodial':{tag:'Why Escrow Global',title:'What makes an escrow feel clear',time:'3 min',intro:'A clear escrow keeps the agreement visible, gives each person a defined role and avoids surprise changes.',steps:[['You keep control','Use a wallet you control and review every payment request before approving it.'],['Everyone sees the same deal','The item or service, amount, deadline, acceptance checks and remedies are agreed before funding.'],['Money stays separate','The agreed amount is kept apart until the next permitted decision. This sandbox only shows that idea with simulated balances.'],['A neutral review is possible','If the facts are disputed, both sides can share evidence and ask for a review within the agreement rules.'],['Know the tradeoff','Clear rules reduce confusion, but they do not guarantee product quality, delivery or a refund.']],note:'The non-custodial model is a product concept, not a promise of live custody or buyer protection.'},

  'wallet-qr':{tag:'Payments',title:'Receive a wallet transfer by QR','time':'2 min',intro:'Create a QR that asks a compatible wallet to send USDC or USDT to an address you control. This is a wallet top-up, not an escrow payment.',steps:[['Use your own address','Enter a wallet address you control and check the full address carefully.'],['Choose the right asset','Select the currency and network you actually intend to receive.'],['Review the request','The sender should see the same address, currency and amount before approving.'],['Check your wallet','Wait for the transfer to appear in your wallet and keep the payment reference.'],['Keep the purposes separate','A wallet top-up does not create or fund an Escrow Global deal.']],note:'This website does not monitor real deposits. Never describe a personal receive QR as an escrow deposit address.'},
  'swap':{title:'Swap into USDC or USDT with Jupiter',intro:'The Jupiter swap screen is separate from an Escrow Global deal. A swap changes assets in your wallet; it does not fund this sandbox.',steps:[['Open Wallet → Swap','Read the warning before enabling the external Jupiter screen.'],['Connect a supported wallet','Use a wallet you control and check that it is on the intended network.'],['Review the quote','Check the input, output, price impact, fees and slippage before approving.'],['Approve only what you understand','Read the wallet request carefully and reject anything unexpected.'],['Check your wallet','Confirm the result in your wallet. A successful swap does not create an Escrow Global deposit.']],note:'This website is an interactive sandbox. Balances and identities are examples only; no real funds move here. The external wallet tool may involve real assets. Use it only when you understand the transaction.'},
  'milestone-planning':{steps:[['Name the outcome','Describe the finished result, format, quantity, owner and handover location.'],['Split the work','Use stages that can be accepted independently instead of hiding all risk in one final step.'],['Write the test','Add objective acceptance checks and identify the evidence a reviewer can inspect.'],['Choose the remedy','Agree revision rounds, cure periods, return logistics or refund conditions before funding.'],['Confirm together','Both parties should accept the same version and asset before funding.']],note:'The milestone planner is a sandbox tool for clearer agreements. It is not legal advice and does not guarantee a result.'},
  'dispute-safely':{steps:[['Pause the right scope','Identify the exact milestone in question. Do not assume unrelated work is part of the dispute.'],['Build a timeline','Keep delivery references, messages, amendments and evidence in chronological order.'],['Invite a response','Give the other party a clear question and a reasonable response window.'],['Apply the agreement','Use the written acceptance test and the remedy both sides accepted.'],['Record the outcome','Explain whether the result is release, refund, revision or continued hold.']],note:'The dispute screen is a demonstration. It does not replace a staffed support process, legal advice or a real buyer-protection service.'},
  'onchain-reconciliation':{tag:'Payments',title:'How to check a payment status',time:'3 min',intro:'Use the deal page and your wallet receipt together. A message saying “approved” is not enough to prove that a payment reached the right place.',steps:[['Open the deal','Start with the agreement you intended to fund.'],['Check the amount and asset','Make sure the payment matches the agreement and uses the intended network.'],['Check the recipient','Confirm the destination shown by your wallet is the one you expected.'],['Check the status','Wait for the wallet and deal page to show a completed result. Do not count a pending payment as complete.'],['Ask for help when they disagree','Keep the receipt and contact support instead of trying the payment repeatedly.']],note:'This website is an interactive sandbox. Balances and identities are examples only; no real funds move here. This website does not monitor real deposits or automatically credit real funds.',sources:[]},

  'protection-receipts':{tag:'Payments',title:'Understand what a deal receipt shows',time:'3 min',intro:'A receipt helps you review one deal. It is useful evidence, but it is not a guarantee about the item, seller or company.',steps:[['Identify the deal','Check the agreement name, parties and current version.'],['Check the asset and amount','Confirm the currency, network and amount shown.'],['Check the parties','Make sure the buyer, seller and fee details match what you agreed.'],['Check the status and time','Look for whether the payment is pending, complete or under review, and when the record was last checked.'],['Understand the limits','A receipt is not insurance, a trust score, proof of product quality or a guarantee of payment.']],note:'Receipts in this sandbox are informational records. Keep the original agreement and ask support about anything that looks wrong.'},

 <section class="panel soft mt28"><div class="eyebrow">THE ESCROW GLOBAL MODEL</div><h2>Decentralized settlement. Marketplace infrastructure.</h2><p class="small mt12">Escrow Global is planned as non-custodial infrastructure—not a company-held balance. In production, a decentralized escrow program would enforce the agreed release rules, while Escrow Global provides the marketplace, agreement workflow and evidence trail. A separate third-party arbiter would handle contested disputes within the authority the agreement grants. The current build is a sandbox with no live custody or deployed program.</p><div class="rule-grid mt20"><div><strong>Keep control</strong><p class="tiny muted mt12">Parties use their own wallets rather than depositing into an Escrow Global account.</p></div><div><strong>Constrain power</strong><p class="tiny muted mt12">Program rules and agreement terms limit where funds can go; the arbiter cannot invent a new recipient.</p></div></div><div class="row wrap mt20"><a class="text-link" href="#/learn/non-custodial">How this differs from traditional escrow ${icon('arrow')}</a><a class="text-link" href="#/rules">Read the settlement rules ${icon('arrow')}</a></div></section>

 <div class="section-head"><div><div class="eyebrow">START WITH CONFIDENCE</div><h2>Less crypto confusion. More clarity.</h2></div><a class="text-link" href="#/learn">Open the guidebook ${icon('arrow')}</a></div><div class="u-guide-grid">${GUIDES.filter(x=>['first-deal','buy-crypto','jupiter-register'].includes(x.id)).map(guideCard).join('')}</div>${box('A working sandbox, not a live escrow provider.','All listings, balances and agreements here are demonstrations. External swap and on-ramp actions are separately labelled and never credit the demo ledger.','warning')}</section></main>`;

 function categories(){return shell('ESCROW, ORGANIZED','A place for every kind of agreement.','Choose the workflow that matches what is actually being delivered.',CATEGORY_GROUPS.map(group=>`<section class="u-category-section"><h2>${e(group)}</h2><div class="u-category-grid">${TAXONOMY.filter(c=>c.group===group).map(c=>`<a class="u-category-card" href="${group==='Physical products'?'#/market?category='+c.id:'#/templates/'+c.template}"><span class="u-category-icon">${icon(c.icon)}</span><h3>${e(c.name)}</h3><p>${e(c.examples)}</p><span class="text-link">${group==='Physical products'?'Browse products':'Use a contract template'} →</span></a>`).join('')}</div></section>`).join('')+`<section class="panel mt28"><h3>Not everything belongs in escrow.</h3><p class="small mt12">Categories are proposed product scope, not permission to operate regulated services.</p><div class="u-prohibited">${PROHIBITED.map(x=>`<span>${e(x)}</span>`).join('')}</div></section>`);}
 function product(id){const l=s().listings.find(x=>x.id===id&&x.kind==='goods'&&x.status==='published');if(!l)return shell('PRODUCT','Product unavailable.','This product is hidden, paused or no longer available.','<a class="btn" href="#/market">Back to marketplace</a>');const seller=b.user(l.sellerId),p=l.packages[0],pv=offeredPrice(l),sv=(l.shippingPrices&&Object.prototype.hasOwnProperty.call(l.shippingPrices,asset()))?l.shippingPrices[asset()]:null;if(pv===null||sv===null)return shell('PRODUCT','Not offered in '+e(asset())+'.','This listing does not quote a price in '+e(asset())+'. Choose a different header asset or return to the marketplace.','<div class="panel"><p class="small">This product is only offered in other currencies. Use the header asset selector to switch, or browse the marketplace.</p><div class="row wrap mt20"><a class="btn btn-primary" href="#/market?type=goods">Back to marketplace</a></div></div>');const total=BigInt(pv)+BigInt(sv);return `<main id="main" class="container u-page"><div class="breadcrumb"><a href="#/market?type=goods">Products</a>${icon('chevron')}<a href="#/market?category=${e(l.categoryId)}">${e(l.category)}</a></div><div class="u-product-detail"><div>${art(l,true)}<div class="u-spec-pills"><span>${icon('shield')}${l.inspectionDays}-day inspection</span><span>${icon('lock')}${l.holdbackBps/100}% warranty holdback</span><span>${icon('clock')}${p.days}-day dispatch</span></div><section class="panel mt20"><h2>Exactly what you’re agreeing to.</h2><p class="scope-text mt20">${e(l.description)}</p><h4 class="mt20">Specifications & condition</h4><p class="small mt12">${e(l.specifications)}<br>${e(l.condition)}</p><h4 class="mt20">Inspect before you accept</h4>${b.listChecks(l.criteria)}<h4 class="mt20">Returns & warranty</h4><p class="small mt12">${e(l.returns)}</p><div class="readonly-note">${l.warrantyDays}-day warranty starts when you confirm receipt. Released funds cannot be recalled; only the retained balance remains available.</div></section></div><aside class="u-product-order"><div class="eyebrow">${e(l.category)} · ${l.sample?'ILLUSTRATIVE INVENTORY':'USER-CREATED DEMO LISTING'}</div><h1>${e(l.title)}</h1><a class="seller-line mt20" href="#/profile/${e(seller.id)}">${avatar(seller)}<span>Offered by <strong>${e(seller.name)}</strong></span></a><section class="panel mt28"><div class="u-price">${fmt(pv)} <span>${e(asset())} / item</span></div><p class="tiny muted mt12">${l.stock} available in the demo · ${e(l.shippingRegion)}</p>${kv('Shipping per order',fmt(sv)+' '+e(asset()))}${kv('One-item principal',fmt(total)+' '+e(asset()))}${kv('Buyer commission reserve (3%)',fmt(total*300n/10000n)+' '+e(asset()))}<div class="mt20">${ub('Start product agreement '+icon('arrow'),'buy-product',`data-id="${e(l.id)}"`,'btn-primary full-width')}</div><p class="tiny muted mt12">Choose quantity and confirm requirements next. No money moves until both parties agree and the buyer funds.</p>${box('Inspection, not instant release.','The seller records shipping. You confirm receipt, inspect the item, and approve the delivery milestone.','soft')}</section><div class="row wrap mt20">${ub('Report listing','report',`data-id="${e(l.id)}"`,'btn-small btn-ghost')}${ub(blocked(l.sellerId)?'Unblock seller':'Block seller','block',`data-id="${e(l.sellerId)}"`,'btn-small btn-ghost')}</div><a href="#/learn/physical-goods" class="text-link mt20">How product escrow works →</a></aside></div></main>`;}
 function domainSellerOffers(l){if(me().id!==l.sellerId)return '';const offers=(s().domainOffers||[]).filter(x=>x.listingId===l.id&&['pending','countered'].includes(x.status));return `<section class="panel soft mt20"><div class="row between"><strong>Offers to review</strong><span class="tiny muted">${offers.length}</span></div>${offers.length?offers.map(o=>`<div class="quote"><div class="row between"><strong class="small">${e(b.user(o.buyerId)?.name||o.buyerId)}</strong><strong class="small">${fmt(o.counterAmount||o.amount)} ${e(o.asset)}</strong></div><p class="tiny muted mt12">${e(o.status.replaceAll('_',' '))} · expires ${date(o.counterExpiresAt||o.expiresAt)}</p><div class="row wrap mt12">${ub('Accept','respond-domain-offer',`data-offer="${e(o.id)}" data-decision="accept"`,'btn-small btn-primary')}${ub('Counter','respond-domain-offer',`data-offer="${e(o.id)}" data-decision="counter"`,'btn-small')}${ub('Reject','respond-domain-offer',`data-offer="${e(o.id)}" data-decision="reject"`,'btn-small btn-ghost')}</div></div>`).join(''):'<p class="small muted mt12">No active offers. Buyers can make offers after control verification.</p>'}</section>`;} function domain(id){const l=s().listings.find(x=>x.id===id&&x.kind==='domain'&&x.status==='published');if(!l)return shell('DOMAIN','Domain unavailable.','This listing is hidden, paused or no longer available.','<a class="btn" href="#/market?type=domains">Back to domains</a>');const seller=b.user(l.sellerId),pv=offeredPrice(l),offer=(s().domainOffers||[]).find(x=>x.listingId===l.id&&x.buyerId===me().id&&['pending','countered','accepted_by_seller'].includes(x.status)),purchaseOffer=offer&&['countered','accepted_by_seller'].includes(offer.status)?offer.id:'';return `<main id="main" class="container u-page"><div class="breadcrumb"><a href="#/market?type=domains">Domains</a>${icon('chevron')}<span>${e(l.domainName)}</span></div><div class="u-domain-detail"><section><div class="u-domain-art large"><span>${icon('globe')}</span><strong>${e(l.domainName)}</strong><small>DOMAIN SALE · ${e(l.transferMethod==='registrar_push'?'REGISTRAR PUSH':'AUTH CODE')}</small></div><section class="panel mt20"><div class="eyebrow">DOMAIN PASSPORT · ${l.controlVerification?'CONTROL VERIFIED':'VERIFICATION PENDING'}</div><h2>Transfer terms are visible before payment.</h2><p class="scope-text mt20">${e(l.description)}</p>${kv('Registrar',e(l.registrar))}${kv('Registration expiry',e(l.expiryDate))}${kv('Renewal responsibility',e(l.renewalResponsibility))}${kv('Transfer method',l.transferMethod==='registrar_push'?'Registrar push':'Authorization-code transfer')}${kv('Included assets',l.includedAssets.map(e).join(', '))}<div class="readonly-note mt20">RDAP/registrar checks and DNS challenges are simulated in this build. Never share an auth code in chat. Buyer funds remain held until the buyer completes the control challenge.</div></section></section><aside class="panel"><div class="eyebrow">${e(l.category)} · ${l.sample?'ILLUSTRATIVE DOMAIN':'USER-CREATED DEMO LISTING'}</div><h1>${e(l.title)}</h1><a class="seller-line mt20" href="#/profile/${e(seller.id)}">${avatar(seller)}<span>Offered by <strong>${e(seller.name)}</strong></span></a>${kv('Buy now',pv===null?'Not offered in '+asset():fmt(pv)+' '+asset())}${kv('Minimum offer',l.minimumOffers?.[asset]?fmt(l.minimumOffers[asset])+' '+asset():'Any offer ≥ 1 '+asset())}<div class="stack mt20">${ub(offer?.status==='countered'?'Accept counteroffer':offer?.status==='accepted_by_seller'?'Buy at accepted offer':'Buy domain now','buy-domain',`data-id="${e(l.id)}" data-offer="${e(purchaseOffer)}"`,'btn-primary full-width')}${ub(offer?'Update / view your offer':'Make an offer','offer-domain',`data-id="${e(l.id)}"`,'btn-small full-width')}</div>${domainSellerOffers(l)}${offer?`<div class="panel soft mt20"><strong>Your offer</strong><p class="small mt12">${fmt(offer.amount)} ${e(offer.asset)} · ${e(offer.status.replaceAll('_',' '))}</p>${offer.status==='countered'?ub('Accept counteroffer','buy-domain',`data-id="${e(l.id)}" data-offer="${e(offer.id)}"`,'btn-small mt12'):''}</div>`:''}${box('Safe handover.','Seller verifies control first. After the buyer funds, the seller initiates the registrar transfer and the buyer verifies DNS control before release.','soft')}<div class="row wrap mt20">${ub('Report listing','report',`data-id="${e(l.id)}"`,'btn-small btn-ghost')}${ub(blocked(l.sellerId)?'Unblock seller':'Block seller','block',`data-id="${e(l.sellerId)}"`,'btn-small btn-ghost')}</div></aside></div></main>`;}
 function payroll(){if(me().role==='admin')return shell('SALARY MANAGEMENT','Employer account only','Review-team identities cannot manage payroll records.','<div class="readonly-note"><strong>Payroll access is restricted to an employer account.</strong> Switch the demo identity to manage staff, budgets and schedules. No payroll data is exposed to the review team.</div><a class="btn btn-primary mt20" href="#/market">Return to marketplace</a>');if(payrollPreviewActor!==me().id){payrollPreview=null;payrollPreviewActor=me().id;}const rows=payrollRoster(),runs=hydratePayrollRunsFromServer(),summary=payrollDashboardSummary();const preview=payrollPreview;return shell('SALARY MANAGEMENT · SANDBOX','Pay your team with a clear plan.','Add staff, set the monthly budget, then approve one payroll batch—or pre-fund a bounded schedule for automatic runs.',`<div class="readonly-note"><strong>Demo only · no real funds.</strong> This preview stores staff and plan receipts only in the selected sandbox account; it never signs a transaction or sends a payment. Production requires verified identity, recipient ownership, a restricted payroll vault and independent review.</div><div class="payroll-summary panel soft" aria-label="Payroll account summary"><div><span class="tiny muted">ACTIVE STAFF</span><strong>${e(summary.activeStaff)}</strong></div><div><span class="tiny muted">MONTHLY PAYROLL</span><strong>${e(summary.monthly)} USDC</strong></div><div><span class="tiny muted">RESERVED / REMAINING</span><strong>${e(summary.reserved)} / ${e(summary.remaining)} USDC</strong></div><div><span class="tiny muted">DISBURSED TO DATE</span><strong>${e(summary.disbursed)} USDC</strong></div><div><span class="tiny muted">NEXT PAYDAY</span><strong>${e(summary.nextPeriod||'Not scheduled')}${summary.nextTimezone?` <small>${e(summary.nextTimezone)}</small>`:''}</strong></div></div><div class="content-two mt20"><section class="panel"><div class="eyebrow">1 · STAFF ROSTER</div><h2>Who should be paid?</h2><div class="payroll-staff-list mt20">${rows.map((r,i)=>`<div class="payroll-staff-row"><div class="payroll-staff-identity"><label>Employee<input form="payroll-form" name="name${i}" value="${e(r.name)}" maxlength="80" aria-label="Employee name for ${e(r.name)}"></label><label>Role<input form="payroll-form" name="role${i}" value="${e(r.role)}" maxlength="80" aria-label="Role for ${e(r.name)}"></label><label>Wallet label<input form="payroll-form" name="wallet${i}" value="${e(r.wallet||'')}" maxlength="160" aria-label="Wallet label for ${e(r.name)}"></label></div><label>Monthly salary (USDC)<input form="payroll-form" name="salary${i}" value="${e(r.salary)}" inputmode="decimal" aria-label="Monthly salary for ${e(r.name)}"></label><label>Solana payout address<input form="payroll-form" name="walletAddress${i}" value="${e(r.walletAddress||'')}" maxlength="64" placeholder="Optional in sandbox" aria-label="Solana payout address for ${e(r.name)}"></label>${ub('Archive','payroll-archive',`data-staff=\"${e(r.id)}\"` ,'btn-small btn-ghost')}</div>`).join('')}</div>${ub('Save roster changes','payroll-save-roster','','btn-small btn-ghost mt12')}<p class="tiny muted mt16">Job roles describe the roster; they do not grant account permissions. Wallet labels are fictional in this preview. An optional Solana address is format-checked and still never receives funds.</p><form data-u-form="payroll-add" class="payroll-add-form mt20"><div class="form-grid"><label>Employee name<input name="name" required maxlength="80"></label><label>Role<input name="role" required maxlength="80"></label></div><div class="form-grid mt12"><label>Monthly salary (USDC)<input name="salary" required inputmode="decimal"></label><label>Recipient wallet label<input name="wallet" required maxlength="160" placeholder="demo-wallet-employee"></label><label>Solana payout address <input name="walletAddress" maxlength="64" placeholder="Optional in sandbox"></label><button class="btn btn-small" type="submit">Add staff member</button></div><p class="u-form-error" role="alert"></p></form></section><aside class="panel"><div class="eyebrow">2 · PLAN & AUTHORIZE</div><h2>Set the monthly budget</h2><form id="payroll-form" data-u-form="payroll" class="mt20"><label>Monthly budget (USDC)<input name="budget" value="10000" inputmode="decimal" required></label><div class="form-grid mt12"><label>Mode<select name="mode"><option value="manual">Approve each month</option><option value="autopay">Pre-funded autopay</option></select></label><label>Months<select name="months"><option>1</option><option>3</option><option selected>6</option><option>12</option></select></label></div><label class="mt12">First payday<input type="date" name="startDate" value="2026-10-30" required></label><label class="checkbox-label mt12"><input type="checkbox" name="acknowledge" required> I reviewed each recipient, salary, date and total commitment.</label><button type="submit" class="btn btn-primary full-width mt20">Preview payroll plan</button><p class="u-form-error" role="alert"></p></form>${preview?`<div class="payroll-preview mt20" aria-live="polite"><div class="eyebrow">REVIEW BEFORE SIGNING</div><h3>${e(preview.error||'Plan ready')}</h3>${preview.error?`<p class="small">No payment was created.</p>`:`<div class="key-value"><span>Monthly salaries</span><strong>${e(formatTokenAmount(preview.result.allocatedUnits))} USDC</strong></div><div class="key-value"><span>Unallocated budget</span><strong>${e(formatTokenAmount(preview.result.unallocatedUnits))} USDC</strong></div><div class="key-value"><span>Total commitment</span><strong>${e(formatTokenAmount(preview.result.commitmentUnits))} USDC</strong></div><div class="key-value"><span>Sandbox funding reservation</span><strong>Reserved before approval</strong></div><p class="tiny muted mt12">${preview.result.mode==='autopay'?'One bounded authorization covers '+preview.result.months+' months. It expires after the final run and never renews automatically.':'One employer approval covers this month only.'}</p>${preview.dates?`<div class="payroll-dates">${preview.dates.map(d=>`<span>${e(d.period)}</span>`).join('')}</div>`:''}<div class="readonly-note mt16">Funding, signing and finality are unavailable in this sandbox. This is a planning receipt, not proof of payment.</div>${preview.approved?`<div class="pill green mt12">Demo approval recorded · ${e(preview.approved.id)}</div>`:ub(preview.error?"Fix the plan first":(preview.result.mode==="autopay"?"Approve & schedule demo":"Approve demo payroll"),"payroll-approve","", "btn-primary mt16")}`}</div>`:''}${runs.length?`<section class="panel payroll-history mt20"><div class="eyebrow">ACCOUNT PAYROLL HISTORY · SANDBOX</div><h2>Recorded plans</h2>${runs.slice(0,8).map(run=>{const nextPeriod=run.periods?.find(period=>period.status==='not_paid');return `<div class="payroll-history-row"><div><strong>${e(run.mode==='autopay'?'Automated schedule':'Monthly payroll')}</strong><span>${e(run.staffCount||rows.length)} staff · ${e(run.months)} month${run.months===1?'':'s'}</span></div><div><strong>${e(run.totalCommitment)} USDC</strong><span>${e(run.status.replaceAll('_',' '))}</span>${run.serverPlanId&&run.status!=='cancelled'&&run.status!=='completed'?ub(run.status==='paused'?'Resume schedule':'Pause schedule',run.status==='paused'?'payroll-resume':'payroll-pause',`data-plan="${e(run.serverPlanId)}" data-run="${e(run.serverRunId||'')}"`,'btn-small btn-ghost mt8'):''}${run.serverPlanId&&run.status!=='cancelled'&&run.status!=='completed'?ub('Cancel schedule','payroll-cancel',`data-plan="${e(run.serverPlanId)}"`,'btn-small btn-ghost mt8'):''}${nextPeriod&&run.serverRunId?ub('Record due demo payout','payroll-run',`data-plan="${e(run.serverPlanId)}" data-run="${e(run.serverRunId)}" data-period="${e(nextPeriod.period)}"`,'btn-small mt8'):''}${ub('Export receipt','payroll-export',`data-run="${e(run.id)}"`,'btn-small btn-ghost mt8')}${ub('Export CSV','payroll-csv',`data-run="${e(run.id)}"`,'btn-small btn-ghost mt8')}</div></div>`;}).join('')}<p class="tiny muted mt12">History is a sandbox receipt. “Record due demo payout” only advances the simulated period; it never moves funds.</p></section>`:''}</aside></div>`);}
 function templates(id){const w=workflowById(id);if(w){if(w.id==='salary_disbursement')return payroll();return shell('AGREEMENT TEMPLATE',e(w.name),e(w.description),`<div class="content-two"><section class="panel"><h3>Decide these before funding.</h3><div class="u-guide-steps">${w.questions.map((x,i)=>`<div><span>${i+1}</span><section><h4>${e(x)}</h4></section></div>`).join('')}</div><div class="u-flow">${w.steps.map(x=>`<span>${e(x)}</span>`).join('')}</div></section><aside class="panel"><h3>Your agreement. Your recipients.</h3><p class="small mt20">Create milestone-specific acceptance conditions. Every stage must add up to the exact total principal.</p>${w.id==='goods'?'<a class="btn btn-primary mt20" href="#/market?type=goods">Start from a product</a>':w.id==='domain_sale'?'<a class="btn btn-primary mt20" href="#/market?type=domains">Browse domain sales</a>':ub('Use this template','agreement',`data-workflow="${e(w.id)}"`,'btn-primary mt20')}${feePolicy()}<a href="#/learn/clear-scope" class="text-link">Read the scope guide →</a></aside></div>`);}
 return shell('BRING YOUR OWN DEAL','Make the agreement the starting point.',`${WORKFLOWS.length} workflows for what you sell, build, deliver or hand over.`,`<div class="u-template-grid">${WORKFLOWS.map((x,i)=>`<a href="#/templates/${x.id}" class="u-template-card"><span class="u-template-number">${String(i+1).padStart(2,'0')}</span><h2>${e(x.name)}</h2><p>${e(x.description)}</p><div class="u-flow">${x.steps.slice(0,3).map(v=>`<span>${e(v)}</span>`).join('')}</div><span class="text-link">Explore workflow →</span></a>`).join('')}</div>${box('A template does not verify a legal obligation.','Use qualified advice for regulated deposits, contracts, title transfers or other jurisdiction-specific obligations. The sandbox enforces only its simulated payment state machine.','warning')}`);}
 function guideCard(g){return `<a class="u-guide-card" href="#/learn/${g.id}"><div class="row between"><span class="eyebrow">${e(g.tag)}</span><span class="tiny muted">${g.time}</span></div><h3>${e(g.title)}</h3><p>${e(g.intro)}</p><span class="text-link">Read guide →</span></a>`;}

><small>Scope · milestones · decisions</small></div></div></section><section class="onboarding-section"><div class="section-head"><div><div class="eyebrow">THE QUICK START</div><h2>Three moves to get oriented.</h2></div><span class="tiny muted">5 minutes to understand the model</span></div><div class="onboarding-step-grid"><article class="onboarding-step-card"><span class="onboarding-step-number">01</span><span class="onboarding-step-icon">${icon('users')}</span><h3>Choose your demo identity</h3><p>Use the identity picker in the header to preview buyer, seller and reviewer journeys. No password or private key is collected.</p><a class="text-link" href="#/orders">Open your workspace →</a></article><article class="onboarding-step-card"><span class="onboarding-step-number">02</span><span class="onboarding-step-icon">${icon('brief')}</span><h3>Make the scope specific</h3><p>Start from a service, product or agreement template. Add measurable milestones, acceptance checks, deadlines and the agreed asset.</p><a class="text-link" href="#/templates">Browse templates →</a></article><article class="onboarding-step-card"><span class="onboarding-step-number">03</span><span class="onboarding-step-icon">${icon('check')}</span><h3>Follow the next decision</h3><p>Each deal room surfaces the next role-limited action: accept, fund, deliver, review, revise or resolve.</p><a class="text-link" href="#/learn/action-center">See the action guide →</a></article></div></section><section class="onboarding-account-grid onboarding-section"><div class="panel onboarding-account-card"><div class="eyebrow">ACCOUNT SETUP</div><h2>How to create an account</h2><p class="small mt12">This preview does not create real accounts yet. Here is the safe path in this build, plus the production boundary to keep in mind.</p><div class="onboarding-checklist"><div><span>1</span><div><strong>Pick a demo role</strong><p>Choose Buyer, Seller or Team from the header identity picker.</p></div></div><div><span>2</span><div><strong>Set your preferences</strong><p>Select USDC or USDT for the examples you want to explore.</p></div></div><div><span>3</span><div><strong>Start a private agreement</strong><p>Open the agreement form and write the exact scope before any simulated funding.</p></div></div></div><div class="onboarding-boundary"><strong>Production note</strong><p>A real launch would add verified sign-in, wallet ownership proofs, recovery and role-based access. Never paste a seed phrase, private key or password into this sandbox.</p></div></div><div class="onboarding-schema-card"><div class="row between"><div><div class="eyebrow">AGREEMENT SCHEMA · v1</div><h3>What a clear deal carries</h3></div><span class="pill green">Readable</span></div><div class="schema-widget" role="img" aria-label="Agreement schema showing scope, milestones, acceptance, deadline and destinations"><div class="schema-row schema-root"><span class="schema-key">agreement</span><span class="schema-value">versioned snapshot</span></div><div class="schema-branch"><div><span class="schema-dot"></span><strong>scope</strong><small>What is being delivered</small></div><div><span class="schema-dot"></span><strong>milestones[]</strong><small>When value is released</small></div><div><span class="schema-dot"></span><strong>acceptance</strong><small>How done is checked</small></div><div><span class="schema-dot"></span><strong>destinations</strong><small>Who can receive/refund</small></div></div><div class="schema-footer"><code>{ scope, milestones[], acceptance, deadline, destinations }</code><span>no silent rewrites</span></div></div></div></section><section class="onboarding-section"><div class="section-head"><div><div class="eyebrow">THE CORE WORKFLOW</div><h2>See the path before you take it.</h2></div><a class="text-link" href="#/rules">Read all rules ${icon('arrow')}</a></div><div class="workflow-board" aria-label="Agreement workflow diagram"><div class="workflow-lane"><span class="workflow-lane-label">AGREEMENT</spa  function simulationRows(result){const max=Math.max(result.totalFunded,1),row=(label,value,kind)=>`<div class="settlement-sim-row"><span>${label}</span><strong>${money(value)}</strong><div class="settlement-sim-track"><i class="${kind}" style="width:${Math.max(0,Math.min(100,value/max*100)).toFixed(2)}%"></i></div></div>`;return `${row('Seller payout',result.sellerPayout,'seller')}${row('Platform fee',result.platformFee,'fee')}${row('Buyer refund',result.buyerRefund,'refund')}`;}
 function settlementSimulator(){const result=calculateSettlement({principal:1000,releasePercent:100});return `<section class="panel settlement-simulator mt28" data-settlement-simulator><div class="eyebrow">INTERACTIVE EXPLAINER · SANDBOX</div><h2>Move the release slider</h2><p class="small mt12">See how the 3% reserve is allocated when none, some or all of the principal is released. This is a teaching model—not a wallet quote or a transaction preview.</p><form data-u-form="simulator" class="settlement-sim-form mt20"><div class="form-grid"><label>Principal in demo USDC<input name="principal" type="number" min="1" max="1000000000" step="0.01" value="1000"></label><label>Principal released<input name="releasePercent" type="range" min="0" max="100" step="5" value="100"><output data-sim-percent>100%</output></label></div><div class="settlement-sim-result" data-sim-result aria-live="polite">${simulationRows(result)}</div><div class="settlement-sim-totals"><span>Buyer funds <strong data-sim-total>${money(result.totalFunded)}</strong></span><span>Reserve <strong data-sim-reserve>${money(result.reserve)}</strong></span><span>Still held <strong data-sim-held>${money(result.heldAfterSettlement)}</strong></span></div><p class="tiny muted mt12">Formula: principal × 3% = reserve; fee is charged only against the released share in this illustration. Production rules must be audited and independently reconciled.</p></form></section>`;}
 function refreshSettlementSimulator(form){const values=Object.fromEntries(new FormData(form));const result=calculateSettlement({principal:values.principal,releasePercent:values.releasePercent});form.querySelector('[data-sim-percent]').value=`${result.releasePercent}%`;form.querySelector('[data-sim-percent]').textContent=`${result.releasePercent}%`;form.querySelector('[data-sim-result]').innerHTML=simulationRows(result);form.querySelector('[data-sim-total]').textContent=money(result.totalFunded);form.querySelector('[data-sim-reserve]').textContent=money(result.reserve);form.querySelector('[data-sim-held]').textContent=money(result.heldAfterSettlement);}
 function learn(id){const g=guideById(id);if(!g)return shell('THE ESCROW GLOBAL GUIDEBOOK','Start clear. Stay in control.','Practical walkthroughs for agreements, crypto payments and Jupiter Spend.',`${guidebookIntro()}<div class="section-head mt28"><div><div class="eyebrow">CHOOSE YOUR NEXT STEP</div><h2>Guides for every part of the journey.</h2></div><span class="tiny muted">${GUIDES.length} walkthroughs · checked ${CHECKED_AT}</span></div><div class="u-guide-grid">${GUIDES.map(guideCard).join('')}</div><p class="tiny muted mt28">External-provider guides checked ${CHECKED_AT}. Recheck eligibility and fees in the provider’s official interface.</p>`);return `<main id="main" class="container u-page"><div class="breadcrumb"><a href="#/learn">Guidebook</a>${icon('chevron')}<span>${e(g.tag)}</span></div><div class="u-learn-layout"><article><div class="eyebrow">${e(g.tag)} · ${g.time}</div><h1>${e(g.title)}</h1><p class="u-lead">${e(g.intro)}</p><section class="u-tutorial-visual" aria-label="Visual explanation of ${e(g.title)}">${tutorialVisual(g.id)}</section>${g.id==='fee-breakdown'?settlementSimulator():''}<div class="u-guide-steps">${g.steps.map(([title,text],i)=>`<div><span>${i+1}</span><section><h2>${e(title)}</h2><p>${e(text)}</p></section></div>`).join('')}</div>${box('Keep this in mind',e(g.note),'warning')}<section class="panel mt28"><h3>${g.sources.length?'Official references':'About this workflow'}</h3><p class="tiny muted mt12">${g.sources.length?'Checked '+CHECKED_AT+'. Availability and fees may change.':'Escrow Global product policy and sandbox behavior, not a third-party guarantee.'}</p><div class="u-source-links">${g.sources.map(([label,url])=>link(e(label),url,'text-link')).join('')}</div></section></article><aside class="u-learn-nav"><h4>In the guidebook</h4>${GUIDES.map(x=>`<a href="#/learn/${x.id}" class="${x.id===g.id?'active':''}">${e(x.title)}</a>`).join('')}<a class="btn btn-primary mt20" href="#/wallet">Open payment hub</a></aside></div></main>`;}
 function wallet(){const tab=path().q.get('tab')||'buy',native=Boolean(window.PACT_NATIVE);return shell('YOUR PAYMENT TOOLKIT','A simpler way to get ready to pay.','Buy stablecoins, swap assets, or learn to spend with Jupiter. Your wallet, Spend account and Escrow Global escrow are separate.',`<div class="u-balance-grid"><div><span>ESCROW GLOBAL SANDBOX BALANCE</span><strong>${fmt((me().balances&&me().balances.USDC)||0)}<small> demo USDC</small></strong><strong>${fmt((me().balances&&me().balances.USDT)||0)}<small> demo USDT</small></strong><p>Simulated funds only. Not a wallet address.</p></div><div><span>YOUR EXTERNAL WALLET</span><strong>${connection?e(connection.account.address.slice(0,5)+'…'+connection.account.address.slice(-5)):'Not connected'}</strong><p>${connection?'Ownership is checked again before provider checkout.':'No private keys or seed phrases requested.'}</p></div><div><span>JUPITER SPEND</span><strong>Separate USD balance</strong><p>Managed in the official Jupiter app, not here.</p></div></div><div class="tabs u-payment-tabs">${[['buy','Buy crypto'],['swap','Jupiter swap'],['receive','Receive by QR'],['spend','Jupiter Spend']].map(([k,l])=>`<a class="tab ${k===tab?'active':''}" href="#/wallet?tab=${k}">${l}</a>`).join('')}</div>${native?box('Native review template','Real swaps, card purchases and payment QR creation are disabled in the bundled native templates. Enable production financial features only after native wallet, security, regional and app-store review.','warning'):''}${tab==='swap'?swapPanel():tab==='receive'?receivePanel():tab==='spend'?spendPanel():buyPanel()}<section class="u-fund-flow"><span>01 &nbsp; Buy or swap</span><i>→</i><span>02 &nbsp; Receive in your wallet</span><i>→</i><span>03 &nbsp; Fund an escrow separately</span></section>${box('Live custody is deliberately unavailable.','The payment tools do not turn this sandbox into a money-handling service. There is no deployed escrow program, live escrow recipient or automatic deposit crediting. Never send funds to a demo identity.','warning')}`);}
 function buyPanel(){const status=config?.moonpay;return `<div class="content-two u-pay-layout"><section class="panel"><div class="row between"><div class="eyebrow">CARD OR BANK → YOUR OWN WALLET</div><span class="pill ${status?.configured?'green':''}">${status?.configured?'MoonPay '+e(status.environment):'Provider configuration required'}</span></div><h2 class="mt20">Buy USDC or USDT.</h2><p class="small mt12">Use the provider’s final quote. Network, eligibility and payment fees matter more than the ticker alone.</p><form data-u-form="onramp" class="mt28"><div class="form-grid">${selectField('Receive on Solana','token',selectors([['USDC','USDC · Solana'],['USDT','USDT · Solana']]))}${selectField('Pay with','method',selectors([['auto','Show available payment methods'],['credit_debit_card','Credit / debit card'],['apple_pay','Apple Pay · where available'],['google_pay','Google Pay · where available'],['sepa_bank_transfer','SEPA bank transfer'],['gbp_bank_transfer','UK bank transfer']]))}${field('Fiat amount','amount','number','100','','min="1" max="100000" step="0.01" required')}${selectField('Fiat currency','fiat',selectors([['usd','USD'],['php','PHP'],['sgd','SGD'],['eur','EUR'],['gbp','GBP'],['aud','AUD'],['cad','CAD']]))}</div><div class="u-wallet-connect"><span>${connection?e(connection.account.address):'Connect your own wallet before opening a prefilled checkout.'}</span>${ub(connection?'Reconnect wallet':'Connect wallet','connect-wallet','','btn-small')}</div><label class="checkbox-label"><input name="acknowledge" type="checkbox" required> I understand this buys into my own wallet, not Escrow Global escrow. Provider KYC, fees and eligibility apply.</label><div class="u-form-error" role="alert"></div><button class="btn btn-primary full-width mt20" type="submit">Continue with MoonPay ↗</button></form><p class="tiny muted mt12">Secret keys stay server-side. Checkout is blocked when credentials, network-specific codes or wallet ownership proof are missing.</p></section><aside class="u-payment-options"><div class="panel"><h3>Other ways to acquire stablecoins</h3><div class="u-option"><b>Independent on-ramp</b><p>Transak’s hosted purchase service is an external alternative. Check that your country and Solana asset are supported.</p>${link('Visit Transak','https://transak.com/','text-link')}</div><div class="u-option"><b>Your exchange or another wallet</b><p>Withdraw the correct USDC or USDT mint on Solana to an address you control. Exchange withdrawal fees and restrictions are separate.</p><a class="text-link" href="#/wallet?tab=receive">Create a wallet receive request →</a></div><div class="u-option"><b>Already have crypto?</b><p>Use Jupiter’s official swap interface to exchange a supported asset. Inspect the wallet transaction before signing.</p><a class="text-link" href="#/wallet?tab=swap">Open the swap panel →</a></div></div><a class="u-guide-card mt20" href="#/learn/buy-crypto"><span class="eyebrow">NEW TO CRYPTO?</span><h3>From your card to the right wallet.</h3><span class="text-link">Follow the walkthrough →</span></a></aside></div>`;}

function seedAndPersist(){
  const seed=createSeedState();
  validateState(seed);
  const beforeNew=readRaw(STORAGE);
  const beforeOld=readRaw(LEGACY_STORAGE);
  if(beforeNew!==null||beforeOld!==null)throw new Error('Refusing to overwrite existing cache.');
  const serialized=JSON.stringify(seed);
  if(!writeRaw(STORAGE,serialized)){
    memoryOnly=true;
    storageSnapshot=null;
    setTimeout(()=>toast('Storage write failed. This session remains in memory only.',true),0);
    return seed;
  }
  storageSnapshot=serialized;
  memoryOnly=false;
  return seed;
}

      validateState(seed);

      storageSnapshot=null;
      try{actorId=localStorage.getItem(STORAGE+'-actor')||localStorage.getItem(LEGACY_STORAGE+'-actor')||'buyer';}catch{}

    }
