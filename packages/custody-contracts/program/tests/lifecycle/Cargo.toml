[workspace]
resolver = "2"

[package]
name = "escrow-global-lifecycle"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "escrow_global_lifecycle"
path = "src/lib.rs"

[features]
default = ["test-mints"]
test-mints = ["escrow-global/test-mints"]

[dependencies]
bincode = "1.3.3"
escrow-global = { path = "../../programs/escrow-global" }
anchor-lang = "0.31.1"
solana-program = "=2.3.0"
# Keep the ProgramTest harness on the same Solana 2.3 syscall/API family as
# the deployable program. Mixing the 2.2.7 harness with solana-program 2.3.0
# makes Cargo select incompatible exact solana-program versions.
solana-program-test = "=2.3.1"
solana-sdk = "=2.3.1"
# spl-token v7 implements Pack through this crate; keep the harness's
# explicit dependency aligned with the Solana 2.2 syscall support crate.
solana-program-pack = "=2.2.1"
spl-token = "7.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
