geoip2 /var/lib/escrow-global-geoip/dbip-country-lite.mmdb {
    auto_reload 5m;
    $escrow_geo_country default=ZZ source=$remote_addr country iso_code;
}

map $http_origin $escrow_cors_origin {
    default "";
    "https://escrowglobal.io" "https://escrowglobal.io";
    "https://www.escrowglobal.io" "https://www.escrowglobal.io";
}

# The shared TLS fallback hides source IP. Do not collapse every visitor into
# one per-IP limit; the app still enforces persistent session/account limits.
map $remote_addr $escrow_limit_key {
    default $binary_remote_addr;
    127.0.0.1 "";
    ::1 "";
}
limit_req_zone $escrow_limit_key zone=escrow_public_ip:10m rate=5r/s;
limit_req_zone $escrow_limit_key zone=escrow_chat_ip:10m rate=3r/s;
